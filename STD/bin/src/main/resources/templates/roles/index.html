<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Roles</h2>
						</div>
					</div>
				</div>
			</div>



			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h5 class="card-title"></h5>


							<div class="d-flex gap-5 justify-content-center">


								<table class="table table-bordered table-striped">

									<thead>
										<tr>
											<th>Rol</th>
											<th>Descripcion</th>
											<th>Estatus</th>
											<th>Componentes Asignados</th>

										</tr>
									</thead>

									<tbody>

										<tr th:each="rol: ${roles}">

											<td th:text="${rol.vc_nombre_rol}">
											<td th:text="${rol.vc_descripcion_rol}">
											<td th:text="${rol.vc_estatus}">
											<td th:text="${rol.vc_estatus}">
											
										</tr>

										<tr th:if="${#lists.isEmpty(roles)}">
											<td colspan="6">
												A&uacute;n no se registran roles en el sistema
											</td>
										</tr>

									</tbody>

								</table>


							</div>

						</div>
					</div>

				</div>

			</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<!--JavaScript-->
	</th:block>
</body>

</html>
