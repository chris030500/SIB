<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<!-- Catalogo -->
			<div class="row">
				<div class="col-md-12">
					<div class="card card-primary">
						<div class="card-header">
							<h2 style="color: black; text-align: center;">Contratos</h2>
						</div>
						<div class="card-body" style="padding-top: 20px;">

							<!-- Agregar contrato -->
							<div class="row">
								<div class="col-sm-6">
									<h5 class="card-title" style="color: black;"><strong>Catalogo</strong>
									</h5>
								</div>
								<div class="col-sm-6" style="text-align: right;">
									<button type="button" class="btn btn-primary" data-toggle="modal"
										data-target="#modal-agregar">Nuevo contrato</button>
								</div>
							</div>
							<!-- Fin Agregar contrato -->

							<div class="row" style="padding-bottom: 20px;">
								<div class="col-sm-12">
									<div class="form-check">
										<input id="checkLista" class="form-check-input" type="checkbox"
											onclick="todosLosContratos()">
										<label class="form-check-label">Todos los contratos</label>
									</div>
								</div>
							</div>

							<!-- Lista de contratos -->
							<div class="row">
								<div class="col-sm-12">
									<div class="card-body table-responsive p-0">
										<table class="table table-hover text-nowrap" style="text-align: center;"
											id="catalogo">
											<thead class="table-secondary">
												<tr>
													<th scope="col">#</th>
													<th scope="col">Contrato</th>
													<th scope="col">Descripción</th>
													<th scope="col">Estatus</th>
													<th scope="col">Acciones</th>
												</tr>
											</thead>
											<tbody>
											</tbody>
										</table>
									</div>
								</div>
							</div>
							<!-- Fin Lista de contratos -->
						</div>
					</div>
				</div>
			</div>
			<!-- Fin Catalogo -->


			<!-- Modal agregar -->
			<div class="modal fade" id="modal-agregar" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title"><strong>Nuevo contrato</strong></h5>
							<button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
						</div>

						<div class="modal-body">
							<div class="row">
								<div class="col-sm-12">
									<form name="formulario" id="formulario">
										<div class="row">
											<div class="col-sm-12">
												<div class="form-group">
													<label>Nombre contrato</label>
													<input type="text" class="form-control" id="contrato" maxlength="55"
														placeholder="nombre" required>
												</div>
												<div class="row">
													<p class="col-sm-12">
														<span
															style="float: right; color: rgb(192, 192, 192); font-style: italic; font-size: 10px;"
															id="contador1">55 caracteres restantes</span>
													</p>
												</div>
											</div>
										</div>
										<div class="row" style="padding-top: 10px;">
											<div class="col-sm-12">
												<div class="form-group">
													<label>Descripción</label>
													<textarea class="form-control" rows="3" id="descripcion"
														maxlength="200" placeholder="describe el contrato"></textarea>
												</div>
												<div class="row">
													<p class="col-sm-12">
														<span
															style="float: right; color: rgb(192, 192, 192); font-style: italic; font-size: 10px;"
															id="contador2">200 caracteres restantes</span>
													</p>
												</div>
											</div>
										</div>
										<div class="row" style="padding-top: 10px;">
											<div class="col-sm-12">
												<div class="form-group">
													<label>Estatus</label>
													<div class="form-check">
														<input class="form-check-input" id="activo" type="radio"
															name="estatus" value="1" onclick="">
														<label class="form-check-label">Activar</label>
													</div>
													<div class="form-check">
														<input class="form-check-input" id="inactivo" type="radio"
															name="estatus" value="0" onclick="" checked>
														<label class="form-check-label">Inactivar</label>
													</div>
												</div>
											</div>
										</div>
									</form>
								</div>
							</div>
						</div>

						<div class="modal-footer">
							<button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
							<button type="button" onclick="validarContrato()" class="btn btn-primary">Guardar</button>
						</div>
					</div>

				</div>
			</div>
			<!-- Fin Modal agregar -->



			<!-- Modal editar -->
			<div class="modal fade" id="modal-editar" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title"><strong>Editar contrato</strong></h5>
							<button type="button" class="btn-close" data-dismiss="modal"
								onclick="cerrarModal()"></button>
						</div>

						<div class="modal-body">
							<div class="row">
								<div class="col-sm-12">
									<form name="formulario" id="formulario">
										<div class="row">
											<div class="col-sm-12">
												<div class="form-group">
													<label>Nombre contrato</label>
													<input type="text" class="form-control" id="idContrato" maxlength="55"
														placeholder="nombre" required>
												</div>
												<div class="row">
													<p class="col-sm-12">
														<span
															style="float: right; color: rgb(192, 192, 192); font-style: italic; font-size: 10px;"
															id="contador3">55 caracteres restantes</span>
													</p>
												</div>
											</div>
										</div>
										<div class="row" style="padding-top: 10px;">
											<div class="col-sm-12">
												<div class="form-group">
													<label>Descripción</label>
													<textarea class="form-control" rows="3" id="idDescripcion" maxlength="200"
														placeholder="describe el contrato"></textarea>
												</div>
												<div class="row">
													<p class="col-sm-12">
														<span
															style="float: right; color: rgb(192, 192, 192); font-style: italic; font-size: 10px;"
															id="contador4">200 caracteres restantes</span>
													</p>
												</div>
											</div>
										</div>

										<!-- Alerta de estatus activo -->
										<div class="row" id="idEstatusActivo" style="display: none; padding-top: 20px;">
											<div class="col-sm-12">
												<div class="alert alert-success">
													El contrato se encuentra <strong>activo.</strong>
												</div>
											</div>
										</div>

										<div class="row" id="idActualizarEstatus" style="padding-top: 10px;">
											<div class="col-sm-12">
												<div class="form-group">
													<label>Estatus</label>
													<div class="form-check">
														<input class="form-check-input" id="idActivo" type="radio"
															name="idEstatus" value="1" onclick="">
														<label class="form-check-label">Activar</label>
													</div>
													<div class="form-check">
														<input class="form-check-input" id="idInactivo" type="radio"
															name="idEstatus" value="0" onclick="" checked>
														<label class="form-check-label">Inactivar</label>
													</div>
												</div>
											</div>
										</div>
									</form>
								</div>
							</div>
						</div>

						<div class="modal-footer">
							<button type="button" class="btn btn-danger" onclick="cerrarModal()">Cerrar</button>
							<button type="button" class="btn btn-primary"
								onclick="formularioEditar(estado)">Guardar</button>
						</div>
					</div>

				</div>
			</div>
			<!-- Fin Modal editar -->


	</section>
	<th:block layout:fragment="page-scripts">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<!--JavaScript-->
		<script th:src="@{/js/catalogo_contratos/documento.js}"></script>
		<script th:src="@{/css/estilos/responsivo.css}"></script>
	</th:block>
</body>

</html>
