<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Validacion de Documentos</h2>
						</div>
					</div>
				</div>
			</div>

			
			<ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">Inicio</button>
    </li>
    <!--
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Menu</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-contact-tab" data-bs-toggle="pill" data-bs-target="#pills-contact" type="button" role="tab" aria-controls="pills-contact" aria-selected="false">Menu 2</button>
    </li>

  
    -->
  </ul>
  <div class="tab-content" id="pills-tabContent">
    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
    <div class="row align-items-start">
    <div class="col">
    <table class="table table-bordered table-striped">

						<thead>
							<tr>
								<th>Procesos pendientes</th>
								<th>Fecha</th>
								<th>Estatus</th>
								<th class="text-center">Opciones</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="producto: ${productos}">

								<td th:text="${producto.vc_nombre_producto}">
								<td th:text="${producto.vc_descripcion_producto}">
								<td th:text="${producto.vc_estatus}">

								<td class="text-center">

								

									<!-- Botón para eliminar registro del producto -->
									<button class="btn btn-danger btn-sm" id="idproducto" name="idproducto"
										onclick="estatusPerfil(this.value)" href="#" title="Eliminar producto"
										data-toggle="modal" data-target="#" th:value="${producto.pk_id_producto}">
										<i class="fas fa-trash"></i>
									</button>

								</td>

							</tr>

							<tr th:if="${#lists.isEmpty(productos)}">
								<td colspan="6">
									A&uacute;n no se registran procesos pendientes en el sistema
								</td>
							</tr>

						</tbody>



					</table>
    </div>
    <div class="col">
    <label for="procesos" class="form-label">Comentarios:</label>
    <div class="input-group">
  
  <textarea class="form-control" aria-label="With textarea"></textarea>
</div>
    </div>
					
					<div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button class="btn btn-primary me-md-2" type="button">Guardar</button>
  </div>
    </div>
    <!--
    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">...</div>
    <div class="tab-pane fade" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab">...</div>
    -->
  </div>
			
			
		
	</section>
	<th:block layout:fragment="page-scripts">
	<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
	<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>	
		<!--JavaScript-->
	</th:block>
</body>
</html>
