log4j.rootLogger=DEBUG, FILE

log4j.appender.FILE=org.apache.log4j.DailyRollingFileAppender
log4j.appender.FILE.Append = true
log4j.appender.FILE.File=/../logs/std.log
#log4j.appender.FILE.File=${catalina_home}/logs/std.log
#log4j.appender.FILE.File=/apache/apache-tomcat-8.0.1/logs/std.log
log4j.appender.FILE.DatePattern='.'yyyy-MM-dd

#log4j.appender.file.MaxFileSize=300MB
log4j.appender.FILE.MaxFileSize=222kb
log4j.appender.file.MaxBackupIndex=1

#log4j.appender.F.MaxFileSize=300KB
#log4j.appender.F.MaxBackupIndex=1

log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %5p %c{1}:%L - %m%n
log4j.logger.org.springframework=WARN