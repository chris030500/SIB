version: "3.8"

services:
  std-app:
    image: std-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: std-app
    ports:
      - "8090:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    restart: unless-stopped
  jenkins:
    image: jenkins/jenkins:lts-jdk17-git
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    ports:
      - "8091:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
  gitea:
    image: gitea/gitea:1.22.5
    container_name: gitea
    ports:
      - "8092:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data
    restart: unless-stopped

volumes:
  jenkins_home:
  gitea_data:
