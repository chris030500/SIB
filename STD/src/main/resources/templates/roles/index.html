<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Roles</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-3">
					<!--<button th:onclick="altaRol()" class="btn btn-primary" id="altaRol">Registrar Rol</button>-->
					<button class="btn btn-primary" tabindex="0" data-bs-toggle="modal" title="Agregar Rol"
									data-bs-target="#modalRol" aria-controls="table-datatable" type="button"
									data-tooltip="Add">
									<i class="bi bi-people-fill"></i>
								</button>
				</div>
				<div class="col-lg-10"></div>
			</div>

			<div class="row">
				<table class="table table-bordered table-striped" style="width: 100%;" id="rolTable">

					<thead>
						<tr>
							<th style="visibility:collapse; display:none;"></th>
							<th>Rol</th>
							<th>Descripcion</th>
							<th>Estatus</th>
							<th>Acciones </th>

						</tr>
					</thead>

					<tbody>

						<tr th:each="rol: ${roles}">
							<td style="visibility:collapse; display:none;" th:text="${rol.pk_id_rol}"></td>
							<td th:text="${rol.vc_nombre_rol}"></td>
							<td th:text="${rol.vc_descripcion_rol}"></td>
							<td th:text="${rol.vc_estatus}"></td>
							<td>
								<button class="btn btn-info" tabindex="0" data-bs-toggle="modal" title="Editar Rol"
									data-bs-target="#editarRol" aria-controls="table-datatable" type="button"
									th:onclick="'modalEditarRol(' + ${rol.pk_id_rol} + ')'" data-tooltip="Add">
									<i class="bi bi-pencil-square"></i>
								</button>
								<button class="btn btn-info" tabindex="0" title="Actualizar Estatus"
									aria-controls="table-datatable" type="button"
									th:onclick="inactivarRol(this)" data-tooltip="Add">
									<i class="bi bi-arrow-repeat"></i>
								</button>
								<button class="btn btn-info" tabindex="0" data-bs-toggle="modal"
									title="Relacionar componentes" data-bs-target="#basicModalProducto"
									aria-controls="table-datatable" type="button" th:onclick="" data-tooltip="Add">
									<i class="bi bi-ui-checks"></i>
								</button>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(roles)}">
											<td colspan="6">
												A&uacute;n no se registran roles en el sistema
											</td>
										</tr>

									</tbody>

								</table>
			</div>
			<div class="modal" id="modalRol">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h4 class="modal-title" id="lblTitulo">Nuevo Rol</h4>
						</div>
						<div class="modal-body">
							<form>
								<div class="col-sm-8" style="margin-top: 10px">
									<label for="busqueda" class="col-form-label"> Nombre Rol:</label>
								</div>
								<div  class="col-sm-10" style="margin-top: 10px">
									<input type="text" class="nombre-rol form-control col-sm-8" id="nombreRol" placeholder="Nombre del Rol" maxlength="100">
								</div>
								<div class="col-sm-8" style="margin-top: 10px">
									<label for="busqueda" class="col-form-label"> Descripcion Rol:</label>
								</div>
								<div  class="col-sm-10" style="margin-top: 10px">
									<textarea type="text-Area" class="form-control" id="descripcionRol" placeholder="Descripcion del Rol" maxlength="300"></textarea>
								</div>
							</form>
						</div>
						<!-- Modal footer -->
						<div class="modal-footer">
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnRegistrar">Registrar</button>
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnCancelar">Cancelar</button>
						</div>
					</div>
				</div>
			</div>
			
			<div class="modal fade" id="editarRol">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h4 class="modal-title" id="lblTitulo">Editar Rol</h4>
						</div>
						<div class="modal-body">
							<form id="edit-form" th:method="post" th:object="${roles}">
								<input id="idRol" name="idRol" type="hidden">
								<div class="col-sm-8" style="margin-top: 10px">
									<label for="lblnombreRol" class="form-label"> Nombre Rol:</label>
								</div>
								<div  class="col-sm-10" style="margin-top: 10px">
									<input type="text" class="form-control" id="inombreRol" placeholder="Nombre del Rol" maxlength="100">
								</div>
								<div class="col-sm-8" style="margin-top: 10px">
									<label for="lblDescripcionRol" class="form-label"> Descripcion Rol:</label>
								</div>
								<div  class="col-sm-10" style="margin-top: 10px">
									<textarea type="text-Area" class="form-control" id="inputDescripcion" placeholder="Descripcion del Rol" maxlength="300"></textarea>
								</div>
							</form>
						</div>
						<!-- Modal footer -->
						<div class="modal-footer">
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnModificar">Modificar</button>
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnCerrar">Cerrar</button>
						</div>
					</div>
				</div>
			</div>
			
			
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://code.jquery.com/jquery-3.2.1.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.26.10/dist/sweetalert2.all.min.js"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/roles/rol.js}"></script>
	</th:block>
</body>

</html>
