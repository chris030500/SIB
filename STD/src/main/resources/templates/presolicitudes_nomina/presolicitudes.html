<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Solicitudes de Crédito</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Nómina</li>
					<li class="breadcrumb-item active">Solicitudes</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h5 class="card-title mb-0">Gestión de Solicitudes</h5>
					<div class="d-flex align-items-center">
						<div id="contenedorBotonExcel" class="d-none me-2">
							<button class="btn btn-outline-success" data-bs-toggle="modal"
								data-bs-target="#uploadExcelModal">
								<i class="bi bi-file-earmark-excel me-1"></i> Cargar Excel
							</button>
						</div>
						<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#solicitudModal">
							<i class="bi bi-plus-circle me-1"></i> Nueva Solicitud
						</button>
					</div>
				</div>

				<!-- Filtros (Placeholders comentados en original, mantenidos ocultos o listos para usar) -->
				<!-- <div class="row g-3 mb-4"> ... </div> -->

				<div class="table-responsive">
					<table class="table table-hover" id="tablaSolicitudes">
						<thead class="table-light">
							<tr>
								<th>No. Solicitud</th>
								<th>Cliente</th>
								<th>No. Empleado</th>
								<th>Fecha</th>
								<th>Empresa</th>
								<th>Monto</th>
								<th>Cuota</th>
								<th>Usuario</th>
								<th>Sucursal</th>
								<th>Estatus</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
		</div>

		<!-- Spinner Overlay -->
		<div id="spinner"
			class="position-fixed top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center"
			style="background: rgba(255,255,255,0.8); z-index: 9999;">
			<div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
				<span class="visually-hidden">Cargando...</span>
			</div>
		</div>

		<!-- Modal Nueva Solicitud -->
		<div class="modal fade" id="solicitudModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-lg modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Registro de Solicitud de Crédito</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="solicitudForm">
							<input type="hidden" id="idSolicitud">

							<div class="mb-3 position-relative">
								<label class="form-label">Nombre de la Empresa</label>
								<input type="search" class="form-control" id="buscarEmpresa" list="opcionEmpresa"
									autocomplete="off" placeholder="Buscar empresa">
								<datalist id="opcionEmpresa"></datalist>
								<div id="spinnerEmpresas"
									class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 me-2"
									style="display: none;"></div>
							</div>

							<div class="mb-3 position-relative">
								<label class="form-label">Nombre del Empleado</label>
								<input type="search" class="form-control" id="buscarEmpleado" list="opcionEmpleado"
									autocomplete="off" placeholder="Buscar empleado">
								<datalist id="opcionEmpleado"></datalist>
								<div id="spinnerEmpleado"
									class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 me-2"
									style="display: none;"></div>
							</div>

							<div class="mb-3 position-relative">
								<label class="form-label">Producto</label>
								<input type="search" class="form-control" id="buscarProducto" list="opcionProducto"
									autocomplete="off" placeholder="Buscar producto">
								<datalist id="opcionProducto"></datalist>
								<div id="spinnerProducto"
									class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 me-2"
									style="display: none;"></div>

								<div id="checkboxNomiPrestamoRow" class="form-check mt-2" style="display: none;">
									<input class="form-check-input" type="checkbox" id="checkNomiprestamo">
									<label class="form-check-label" for="checkNomiprestamo">¿Es renovación?</label>
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-4">
									<label class="form-label">Núm. Empleado</label>
									<input type="text" id="numEmpleado" class="form-control" placeholder="Ej: 2434">
								</div>
								<div class="col-md-4">
									<label class="form-label">Puesto</label>
									<select id="puesto" class="form-select">
										<option value="" disabled selected>Seleccione...</option>
									</select>
								</div>
								<div class="col-md-4">
									<label class="form-label">Plazo</label>
									<div id="plazoCreditoContainer">
										<select class="form-select" id="plazoCredito">
											<option value="" disabled selected>Seleccione...</option>
										</select>
									</div>
									<span id="spinnerPlazo" class="text-muted small"
										style="display:none;">Cargando...</span>
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-4">
									<label class="form-label">Frecuencia de Pago</label>
									<select class="form-select" id="frecuenciaCredito">
										<option value="0">Seleccione...</option>
										<option th:each="tipo : ${cat_tipo_frecuencia}" th:value="${tipo.id}"
											th:text="${tipo.descFrecuencia}"></option>
									</select>
								</div>
								<div class="col-md-4">
									<label class="form-label">Monto Solicitado</label>
									<div class="input-group">
										<span class="input-group-text">$</span>
										<input type="number" id="montoSolicitado" class="form-control text-end" min="0"
											step="0.01">
									</div>
								</div>
								<div class="col-md-4">
									<label class="form-label">Monto a Descontar</label>
									<div class="input-group">
										<span class="input-group-text">$</span>
										<input type="number" id="montoDescontar" class="form-control text-end" min="0"
											step="0.01" readonly>
									</div>
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label">Comentarios</label>
								<textarea class="form-control" id="comentariosSolicitud" rows="3"></textarea>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="btn btn-primary" id="btnGuardarSolicitud">Guardar</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Modal Mensaje -->
		<div class="modal fade" id="mensajeModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Texto del Correo</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form>
							<div class="mb-3">
								<label class="form-label">Mensaje</label>
								<textarea class="form-control" id="mensajeTexto" rows="4"></textarea>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="btn btn-primary">Guardar</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Modal Cargar Excel -->
		<div class="modal fade" id="uploadExcelModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Subir Archivo Excel</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="uploadExcelForm">
							<div class="mb-3">
								<label class="form-label">Seleccionar archivo (.xls, .xlsx)</label>
								<input type="file" class="form-control" id="excelFile" accept=".xls,.xlsx">
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="btn btn-primary" id="uploadExcelButton">Subir</button>
					</div>
				</div>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<script th:src="@{/js/presolicitudes/presolicitudes.js}"></script>
		<script th:src="@{/js/presolicitudes/configuracionTablas.js}"></script>
		<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
