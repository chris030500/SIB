<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Cobro Domiciliado</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">

		<body>
			<div class="container mt-4">
				<div class="p-3 mb-4 text-white text-center" style="background-color: #33A9FF;">
					<h2>Solicitudes de Crédito</h2>
				</div>

				<div class="d-flex flex-wrap align-items-end gap-2 mb-3">
					<!-- Botón para cargar archivo Excel -->
					<div class="w-auto">
						<label class="form-label d-block">&nbsp;</label>
						<button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#uploadExcelModal">
							Cargar Excel
						</button>
					</div>
				</div>

				<div class="d-flex flex-wrap align-items-end gap-2 mb-3">
					<!-- Empresa -->
					<div class="flex-grow-1">
						<label for="filtroEmpresa" class="form-label">Buscar Empresa</label>
						<input type="search" class="form-control" id="filtroEmpresa" list="listaEmpresas"
							autocomplete="off" placeholder="Buscar empresa">
						<datalist id="listaEmpresas"></datalist>
						<div id="spinnerEmpresas" class="spinner-border text-primary" style="display: none;"></div>
					</div>

					<!-- Cliente -->
					<div class="flex-grow-1">
						<label for="filtroClientes" class="form-label">Buscar Cliente</label>
						<input type="search" class="form-control" id="filtroClientes" list="listaClientes"
							autocomplete="off" placeholder="Buscar empresa">
						<datalist id="listaClientes"></datalist>
						<div id="spinnerClientes" class="spinner-border text-primary" style="display: none;"></div>
					</div>

					<!-- Fecha inicio -->
					<div class="w-auto">
						<label for="fechaInicio" class="form-label">Fecha Inicio</label>
						<input type="date" id="fechaInicio" class="form-control">
					</div>

					<!-- Fecha fin -->
					<div class="w-auto">
						<label for="fechaFin" class="form-label">Fecha Fin</label>
						<input type="date" id="fechaFin" class="form-control">
					</div>

					<!-- Botón Buscar -->
					<div class="w-auto">
						<label class="form-label d-block">&nbsp;</label>
						<button class="btn btn-primary"><i class="fas fa-search"></i></button>
					</div>

					<!-- Botón Nueva Solicitud -->
					<div class="w-auto">
						<label class="form-label d-block">&nbsp;</label>
						<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#solicitudModal">
							Nueva Solicitud
						</button>
					</div>
				</div>

				<!-- Spinner de carga -->
				<div id="spinner" class="spinner-border text-primary"
					style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999;">
					<span class="sr-only">Cargando...</span>
				</div>

				<table class="table table-bordered text-center">
					<thead class="table-primary">
						<tr>
							<th>No. Cliente</th>
							<th>Nombre de Cliente</th>
							<th>Fecha de Solicitud</th>
							<th>Nombre de Empresa</th>
							<th>Monto</th>
							<th>Cuota</th>
							<th>Estatus</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody id="tablaSolicitudes">
					</tbody>
				</table>
				<div class="d-flex justify-content-between">
					<button id="btnAnterior" class="btn btn-primary">Anterior</button>
					<span id="paginaActual">Página 1</span>
					<button id="btnSiguiente" class="btn btn-primary">Siguiente</button>
				</div>
			</div>
		</body>

		<!-- Modal para Nueva Solicitud de Crédito -->
		<div class="modal fade" id="solicitudModal" tabindex="-1" aria-labelledby="solicitudModalLabel">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<!-- Encabezado del modal -->
					<div class="modal-header bg-primary text-white">
						<h5 class="modal-title" id="solicitudModalLabel">Registro de Solicitud de Crédito</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>

					<!-- Cuerpo del modal -->
					<div class="modal-body">
						<form id="solicitudForm">
							<!-- Primera fila -->
							<input type="hidden" id="idSolicitud">
							<div class="row mb-3">
								<div class="col-md-12">
									<label for="buscarEmpresa" class="form-label">Nombre de la Empresa</label>
									<input type="search" class="form-control" id="buscarEmpresa" list="opcionEmpresa"
										autocomplete="off" placeholder="Buscar empresa">
									<datalist id="opcionEmpresa"></datalist>
									<div id="spinnerEmpresas" class="spinner-border text-primary"
										style="display: none;"></div>
								</div>
							</div>

							<!-- Segunda fila -->
							<div class="row mb-3">
								<div class="col-md-12">
									<label for="buscarEmpleado" class="form-label">Nombre del Empleado</label>
									<input type="search" class="form-control" id="buscarEmpleado" list="opcionEmpleado"
										autocomplete="off" placeholder="Buscar empleado">
									<datalist id="opcionEmpleado"></datalist>
									<div id="spinnerEmpleado" class="spinner-border text-primary"
										style="display: none;"></div>
								</div>
							</div>

							<!-- Segunda fila -->
							<div class="col-md-12">
								<label for="buscarProducto" class="form-label">Producto</label>
								<input type="search" class="form-control mb-2" id="buscarProducto" list="opcionProducto"
									autocomplete="off" placeholder="Buscar producto">
								<datalist id="opcionProducto"></datalist>
								<div id="spinnerProducto" class="spinner-border text-primary" style="display: none;">
								</div>

								<!-- Checkbox solo visible si el producto es NOMIPRESTAMO -->
								<div id="checkboxNomiPrestamoRow" class="form-check mt-2" style="display: none;">
									<input class="form-check-input" type="checkbox" id="checkNomiprestamo">
									<label class="form-check-label" for="checkNomiprestamo">
										¿Este crédito es una renovación?
									</label>
								</div>
							</div>


							<!-- Tercera fila -->
							<div class="row mb-3">
								<div class="col-md-4">
									<label class="form-label">Núm. Empleado</label>
									<input type="text" id="numEmpleado" class="form-control"
										placeholder="Ejemplo: 2434">
								</div>
								<div class="col-md-4">
									<label class="form-label">Puesto</label>
									<select id="puesto" class="form-select">
										<option value="" disabled selected>Seleccione un puesto...</option>
									</select>
								</div>
								<div class="col-md-4">
									<label for="plazoCredito" class="form-label">Plazo</label>
									<div id="plazoCreditoContainer">
										<select class="form-select" id="plazoCredito">
											<option value="" disabled selected>Seleccione...</option>
										</select>
									</div>
									<span id="spinnerPlazo" style="display:none;">Cargando...</span>
								</div>
							</div>

							<!-- Cuarta fila -->
							<div class="row mb-3">
								<div class="col-md-4">
									<label class="form-label">Frecuencia de Pago</label>
									<select class="form-select" id="frecuenciaCredito">
										<option value="" disabled selected>Seleccione...</option>
										<option value="SEMANAL">Semanal</option>
										<option value="CATORCENAL">Catorcenal</option>
										<option value="QUINCENAL">Quincenal</option>
										<option value="MENSUAL">Mensual</option>
										<option value="UNICO">Unico</option>
									</select>
								</div>
								<div class="col-md-4">
									<label class="form-label">Monto Solicitado</label>
									<div class="input-group">
										<span class="input-group-text">$</span>
										<input type="number" id="montoSolicitado" class="form-control text-end"
											placeholder="10000" min="0" step="0.01">
									</div>
								</div>
								<div class="col-md-4">
									<label class="form-label">Monto a descontar</label>
									<div class="input-group">
										<span class="input-group-text">$</span>
										<input type="number" id="montoDescontar" class="form-control text-end"
											placeholder="500" min="0" step="0.01">
									</div>
								</div>
							</div>
							<!-- Campo de comentarios -->
							<div class="row mb-3">
								<div class="col-md-12">
									<label for="comentariosSolicitud" class="form-label">Comentarios</label>
									<textarea class="form-control" id="comentariosSolicitud" rows="3"
										placeholder="Escribe un comentario (opcional)..."></textarea>
								</div>
							</div>
						</form>
					</div>

					<!-- Footer del modal -->
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="btn btn-primary" id="btnGuardarSolicitud">Guardar</button>
					</div>
				</div>
			</div>
		</div>


		<!-- Modal para enviar mensaje -->
		<div class="modal fade" id="mensajeModal" tabindex="-1" aria-labelledby="mensajeModalLabel">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="mensajeModalLabel">Texto del Correo</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form>
							<div class="mb-3">
								<label for="mensajeTexto" class="form-label">Mensaje</label>
								<textarea class="form-control" id="mensajeTexto" rows="4"
									placeholder="Escribe tu mensaje aquí"></textarea>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="btn btn-primary">Guardar</button>
					</div>
				</div>
			</div>
		</div>

		<div class="modal fade" id="uploadExcelModal" tabindex="-1" aria-labelledby="uploadExcelModalLabel">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header bg-info text-white">
						<h5 class="modal-title" id="uploadExcelModalLabel">Subir Archivo Excel</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="uploadExcelForm">
							<div class="mb-3">
								<label for="excelFile" class="form-label">Seleccionar archivo Excel</label>
								<input type="file" class="form-control" id="excelFile" accept=".xls,.xlsx">
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="button" class="btn btn-primary" id="uploadExcelButton">Subir</button>
					</div>
				</div>
			</div>
		</div>
	</section>

	<th:block layout:fragment="page-scripts">
		<!-- Bootstrap JS (si falta) -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

		<!-- jQuery (si es necesario para otras funciones) -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

		<!-- Plugins y scripts adicionales -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/presolicitudes/presolicitudes.js}"></script>
		<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
		<script th:src="@{/css/estilos/responsivo.css}"></script>
	</th:block>


</body>

</html>
