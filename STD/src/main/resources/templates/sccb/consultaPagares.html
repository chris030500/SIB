<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Consulta de Pagarés</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">SCCB</li>
					<li class="breadcrumb-item active">Pagarés</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Búsqueda de Pagarés</h5>

				<form class="row g-3 mb-4">
					<div class="col-md-4">
						<label class="form-label">Buscar por</label>
						<select class="form-select" id="opciones">
							<option value="0" selected>Seleccione...</option>
							<option value="1">No. de crédito</option>
							<option value="2">No. de cliente</option>
							<option value="3">Nombre</option>
						</select>
					</div>

					<div class="col-md-6">
						<!-- Búsqueda por Crédito -->
						<div id="divCredito" style="display: none;">
							<label for="creditoBusqueda" class="form-label">No. de Crédito</label>
							<input type="text" class="form-control solo-numero" id="creditoBusqueda"
								placeholder="Ingrese número de crédito">
						</div>

						<!-- Búsqueda por Cliente -->
						<div id="divCliente" style="display: none;">
							<label for="clienteBusqueda" class="form-label">No. de Cliente</label>
							<input type="text" class="form-control solo-numero" id="clienteBusqueda"
								placeholder="Ingrese número de cliente">
						</div>

						<!-- Búsqueda por Nombre -->
						<div id="divName" style="display: none;">
							<label for="nameBusqueda" class="form-label">Nombre</label>
							<input id="nameBusqueda" type="search" class="form-control mb-2"
								placeholder="Buscar nombre..." onkeyup="buscarNombre(this.value);">
							<select id="selectName" class="form-select" name="selectName" size="3"></select>
						</div>
					</div>

					<div class="col-md-2 d-flex align-items-end gap-2">
						<button class="btn btn-primary w-100" type="button" onclick="buscarDatos()" id="btnBuscar"
							style="display: none;">
							<i class="bi bi-search me-1"></i> Buscar
						</button>
						<button class="btn btn-secondary w-100" type="button" onclick="cleanView()" id="btnClean"
							style="display: none;">
							<i class="bi bi-eraser-fill me-1"></i> Limpiar
						</button>
					</div>
				</form>

				<!-- Tabla de Resultados -->
				<div id="divPagares" style="display: none;">
					<h6 class="fw-bold mb-3 text-center">Lista de Control de Pagarés</h6>
					<div class="table-responsive">
						<table id="pagares" class="table table-hover text-center">
							<thead class="table-light">
								<tr>
									<th>Tipo documento</th>
									<th>Ubicación</th>
									<th>Cliente</th>
									<th>Acuerdo</th>
									<th>Importe</th>
									<th>Fecha Inicio</th>
									<th>Estatus</th>
									<th>Fecha evento</th>
									<th>Solicitante</th>
									<th>Centro</th>
									<th>Destino</th>
									<th>Asignado a</th>
									<th>Etapa</th>
									<th>Razón Devolución</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>

			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/sweetalert2@7.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/sccb/pagares.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
