<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Generación de Contrato</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Contratos</li>
					<li class="breadcrumb-item active">Generar Contrato</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Datos del Contrato</h5>

				<div id="mensaje" class="alert alert-danger d-none" role="alert"></div>

				<form id="formContrato" class="row g-3">

					<div class="col-md-12">
						<label for="inputSolicitud" class="form-label">Solicitud de crédito</label>
						<div class="input-group">
							<input type="text" class="form-control solo-numero" id="inputSolicitud"
								placeholder="Ingrese número de solicitud" maxlength="12">
							<button class="btn btn-primary" type="button" th:onclick="buscarDatosSolicitud()"
								title="Buscar Solicitud">
								<i class="bi bi-search"></i> Buscar
							</button>
						</div>
					</div>

					<div class="col-md-6">
						<label for="inputNombre" class="form-label">Nombre del Cliente</label>
						<input type="text" class="form-control" id="inputNombre" readonly>
					</div>

					<div class="col-md-6">
						<label for="inputDireccion" class="form-label">Dirección del cliente</label>
						<textarea class="form-control" id="inputDireccion" rows="1" readonly></textarea>
					</div>

					<div class="col-md-6">
						<label for="fecha" class="form-label">Fecha de suscripción</label>
						<input type="date" id="fecha" class="form-control" name="fecha">
					</div>

					<div class="col-md-6">
						<label for="inputCapital" class="form-label">Capital Otorgado</label>
						<input type="text" class="form-control" id="inputCapital" readonly>
					</div>

					<div class="col-md-4">
						<label for="inputTasaOrdinaria" class="form-label">Tasa de Interés Ordinaria</label>
						<input type="text" class="form-control" id="inputTasaOrdinaria" readonly>
					</div>

					<div class="col-md-4">
						<label for="inputTasaMoratoria" class="form-label">Tasa de Interés Moratoria</label>
						<input type="text" class="form-control" id="inputTasaMoratoria" readonly>
					</div>

					<div class="col-md-4">
						<label for="cat" class="form-label">CAT</label>
						<input type="number" class="form-control" id="cat" placeholder="0.0" min="0">
					</div>

					<input type="hidden" id="valAnterior">
					<input type="hidden" id="reca">

					<div class="col-12 text-end mt-4">
						<button class="btn btn-success" type="button" th:onclick="verReporte()">
							<i class="bi bi-file-earmark-pdf-fill me-1"></i> Generar Contrato
						</button>
					</div>
				</form>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/contratos/contrato.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
	</th:block>
</body>

</html>
