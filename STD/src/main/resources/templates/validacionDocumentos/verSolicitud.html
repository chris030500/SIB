<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body onload="buscarSolicitudCredito();">
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Detalle de Solicitud</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Validación</li>
					<li class="breadcrumb-item active">Ver Solicitud</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Información de la Solicitud</h5>

				<div id="mensaje" class="alert alert-danger text-center fw-bold d-none"></div>

				<div class="row g-3 mb-4">
					<!-- IDs Ocultos y Visibles -->
					<div class="col-md-4" id="divSolicitudEnvio" style="display:none;">
						<label class="form-label">Id. Solicitud Envío</label>
						<input type="text" class="form-control" id="solicitudEnvio" th:value="${solicitudEnvio}"
							readonly>
					</div>
					<div class="col-md-4">
						<label class="form-label">No. Solicitud</label>
						<input type="text" class="form-control" id="i_no_solicitud_core"
							th:value="${solicitud.i_no_solicitud_core}" readonly>
					</div>

					<!-- Datos del Crédito -->
					<div class="col-md-4" id="divIdProducto" style="display:none;">
						<label class="form-label">ID Producto</label>
						<input type="text" class="form-control" id="producto" readonly>
					</div>
					<div class="col-md-4" id="divclienteId" style="display:none;">
						<label class="form-label">Cliente ID</label>
						<input type="text" class="form-control" id="clienteId" readonly>
					</div>

					<div class="col-md-4">
						<label class="form-label">Producto</label>
						<input type="text" class="form-control" id="Nombreproducto" readonly>
					</div>
					<div class="col-md-4">
						<label class="form-label">Monto Solicitado</label>
						<input type="number" class="form-control" id="montoSolicitado" readonly>
					</div>
					<div class="col-md-4">
						<label class="form-label">Monto Autorizado</label>
						<input type="number" class="form-control" id="montoAutorizado" readonly>
					</div>
					<div class="col-md-4">
						<label class="form-label">Plazo</label>
						<input type="text" class="form-control" id="plazo" readonly>
					</div>
					<div class="col-md-4">
						<label class="form-label">Tasa Normal</label>
						<input type="number" class="form-control" id="tasaNormal" readonly>
					</div>
					<div class="col-md-4">
						<label class="form-label">Estatus</label>
						<input type="text" class="form-control" id="estatus" readonly>
					</div>
				</div>

				<hr class="my-4">

				<!-- Participantes -->
				<div id="divParticipantes" class="mb-4">
					<h5 class="card-title">Participantes</h5>
					<div class="table-responsive">
						<table id="participantes" class="table table-hover">
							<thead class="table-light">
								<tr>
									<th>Nombre</th>
									<th>Rol</th>
									<th>Tel. Celular</th>
									<th>Correo</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>

				<!-- Documentos -->
				<div id="divDocumentos" class="mb-4" style="display:none;">
					<h5 class="card-title">Documentos</h5>
					<div class="table-responsive">
						<table class="table table-hover" id="tablaDocumentos">
							<thead class="table-light">
								<tr>
									<th>Nombre de documento</th>
									<th>Ver documento</th>
									<th>Aprobar documento</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>

				<!-- Botón VoBo -->
				<div id="btnVoBo" class="text-end" style="display:none;">
					<button id="btnVoBoDocumentos" type="button" class="btn btn-primary">
						<span id="spanGuardar">Guardar</span>
						<span id="spanCargando" class="spinner-border spinner-border-sm ms-2"
							style="display: none;"></span>
					</button>
				</div>

			</div>
		</div>

		<!-- Spinner Overlay -->
		<div id="spinnerID"
			class="position-fixed top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center"
			style="background: rgba(255,255,255,0.8); z-index: 9999;">
			<div class="text-center">
				<div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
					<span class="visually-hidden">Cargando...</span>
				</div>
				<h4 class="mt-3 text-primary">Cargando solicitud...</h4>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/validacionDocumentos/validacionDocumentos.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
