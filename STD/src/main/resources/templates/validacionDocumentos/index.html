<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/datatables/datatables.min.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/vendor/datatables/Responsive-2.4.0/css/responsive.bootstrap.min.css}" />



</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Validador de Documentos</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h5 class="card-title"></h5>



							<div class="row">
								<h1>Solicitudes</h1>
								<table id="solicitudesTable" class="table table-bordered table-striped datatable-responsive" style="width: 100%;">

									<!-- Header Table -->
									<thead>
										<tr>
											<th>No. Solicitud</th>
											<th>Fecha Envio</th>
											<th>Hora Envio</th>
											<th>Fecha Cancelación</th>
											<th>Hora Cancelación</th>
											<th>Observaciones</th>
											<th>Estatus</th>
											<th>Acciones</th>
										</tr>
									</thead>
									<!-- Footer Table -->
									<tfoot>
										<tr>
											<th>No. Solicitud</th>
											<th>Fecha Envio</th>
											<th>Hora Envio</th>
											<th>Fecha Cancelación</th>
											<th>Hora Cancelación</th>
											<th>Observaciones</th>
											<th>Estatus</th>
											<th>Acciones</th>
										</tr>
									</tfoot>
								</table>

							</div>
						</div>
					</div>
				</div>


			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script type="text/javascript" th:src="@{/vendor/datatables/datatables.min.js}"></script>
		<script type="text/javascript" th:src="@{/vendor/datatables/Responsive-2.4.0/js/dataTables.responsive.min.js}"></script>
		<script th:src="@{/js/validacionDocumentos/dataTableValidacionDocumentos.js}"></script>
		<script th:src="@{/js/validacionDocumentos/validacionDocumentos.js}"></script>
		<!--<script th:src="@{/js/usuario/usuarios.js}"></script>-->
	</th:block>
</body>

</html>
