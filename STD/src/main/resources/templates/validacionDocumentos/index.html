<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Validador de Documentos</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Validación</li>
					<li class="breadcrumb-item active">Documentos</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Solicitudes Pendientes</h5>

				<div class="table-responsive">
					<table id="solicitudesTable" class="table table-hover text-center">
						<thead class="table-light">
							<tr>
								<th>No. Solicitud</th>
								<th>Fecha Envío</th>
								<th>Hora Envío</th>
								<th>Fecha Cancelación</th>
								<th>Hora Cancelación</th>
								<th>Observaciones</th>
								<th>Estatus</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>

			</div>
		</div>

		<div id="loader"></div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/validacionDocumentos/dataTableValidacionDocumentos.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
