<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Generación de Contraseña</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Configuración</li>
					<li class="breadcrumb-item active">Generar Contraseña</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="row">
			<div class="col-lg-8">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Generar Nueva Contraseña</h5>

						<form th:action="@{/configuracion/guardarContrasena}" method="get" class="row g-3">
							<div class="col-12">
								<label for="contrasena" class="form-label">Contraseña Generada</label>
								<div class="input-group">
									<input type="text" class="form-control" id="contrasena" name="contrasena" required
										placeholder="Contraseña" autocomplete="off">
									<button class="btn btn-outline-secondary" type="button"
										onclick="generarContrasena()">
										<i class="bi bi-arrow-clockwise"></i> Generar
									</button>
								</div>
							</div>

							<div class="col-12 text-end mt-4">
								<button type="button" onclick="generarContrasena()" class="btn btn-primary">
									<i class="bi bi-save me-1"></i> Guardar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div class="col-lg-4">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Parámetros Vigentes</h5>

						<ul class="list-group list-group-flush">
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Longitud
								<span class="badge bg-primary rounded-pill" th:text="${longitud}"></span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Mayúsculas
								<span class="badge bg-primary rounded-pill" th:text="${mayusculas}"></span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Minúsculas
								<span class="badge bg-primary rounded-pill" th:text="${minusculas}"></span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Números
								<span class="badge bg-primary rounded-pill" th:text="${numeros}"></span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Especiales
								<span class="badge bg-primary rounded-pill" th:text="${caracteres}"></span>
							</li>
						</ul>

					</div>
				</div>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/configuracion.js}"></script>
	</th:block>
</body>

</html>
