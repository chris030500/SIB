<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Desbloqueo de Usuarios</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Configuración</li>
					<li class="breadcrumb-item active">Desbloqueo</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Gestión de Bloqueos</h5>

				<form class="row g-3" th:action="@{/configuracion/cambioSesiones}" id="formDesbloqueo" method="post">

					<div class="col-md-12">
						<label for="buscarUsuario" class="form-label">Buscar usuario</label>
						<div class="input-group">
							<span class="input-group-text"><i class="bi bi-search"></i></span>
							<input type="search" class="form-control" name="busquedaUsuario"
								placeholder="Nombre de usuario..." onkeyup="buscar_ajax(this.value);">
						</div>
					</div>

					<div class="col-md-6">
						<label for="selectUsuario" class="form-label">Elige un usuario</label>
						<select class="form-select" multiple aria-label="multiple select example" id="selectUsuario"
							name="selectUsuario" size="5">
						</select>
					</div>

					<div class="col-md-6">
						<label class="form-label">Acción a realizar</label>
						<div class="card p-3 bg-light">
							<div class="form-check mb-2">
								<input class="form-check-input" type="checkbox" id="desbloquearSesion" name="desbloqueo"
									value="desbloquearSesion" onclick="desmarcar()">
								<label class="form-check-label" for="desbloquearSesion">
									Desbloquear sesión
								</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="checkbox" id="desbloquearCuenta" name="desbloqueo"
									value="desbloquearCuenta" onclick="desmarcar()">
								<label class="form-check-label" for="desbloquearCuenta">
									Desbloquear cuenta
								</label>
							</div>
						</div>
					</div>

					<div class="col-12 text-end">
						<button type="button" onclick="desbloquearUsuario()" class="btn btn-primary">
							<i class="bi bi-unlock-fill me-1"></i> Guardar Cambios
						</button>
					</div>
				</form>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/configuracion.js}"></script>
	</th:block>
</body>

</html>
