<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-3"></div>
					<div class="col-md-9">
						<div class="card-body">
							<h2>Bloqueo por inactividad</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12">
					<div class="card mb-12">
						<div class="card-header"></div>
						<br>
						<div class="card-body">
							<form class="row g-3" th:action="@{/configuracion/cambioSesiones}" id="formDesbloqueo"
								method="post">
								<div class="col-12">
									<label for="buscarUsuario" class="form-label">Buscar
										usuario</label>
									<input type="search" class="form-control" name="busquedaUsuario"
										placeholder="Nombre de usuario" onkeyup="buscar_ajax(this.value);">

								</div>
								<div class="col-sm-6">
									<label for="buscarUsuario" class="form-label">Elige un usuario</label>

									<select class="form-select" multiple aria-label="multiple select example"
										id="selectUsuario" name="selectUsuario">
									</select>
								</div>
								<div class="col-sm-6">
									<label for="buscarUsuario" class="form-label">¿Que desea realizar:</label>
									<div>
										<input type="checkbox" id="desbloquearSesion" name="desbloqueo"
											value="desbloquearSesion" onclick="desmarcar()">
										  <label for="desbloquearSesion">Desbloquear sesión</label><br>
									</div>
									<div>
										<input type="checkbox" id="desbloquearCuenta" name="desbloqueo"
											value="desbloquearCuenta" onclick="desmarcar()">
										  <label for="desbloquearCuenta">Desbloquear cuenta</label><br>
									</div>
								</div>
								<div class="col-sm-2">
									<button type="button" onclick="desbloquearUsuario()"
										class="btn btn-primary">Guardar</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script th:src="@{/js/configuracion.js}"></script>
	</th:block>
</body>

</html>
