<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>

	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-4"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2>Configuración de contraseña</h2>

						</div>
					</div>
				</div>
			</div>

			<div class="row">

				<div class="col-xl-12">

					<div class="card">
						<div class="card-body pt-3">
							<!-- Bordered Tabs -->
							<ul class="nav nav-tabs nav-tabs-bordered">


								<li class="nav-item">
									<button class="nav-link active" data-bs-toggle="tab"
										data-bs-target="#parametros-contrasena">Editar Parametros Contraseña</button>
								</li>

								<li class="nav-item">
									<button class="nav-link" data-bs-toggle="tab"
										data-bs-target="#cambiar-contrasena">Cambiar contraseña por default</button>
								</li>

							</ul>
							<div class="tab-content pt-2">


								<div class="tab-pane fade show active parametros-contrasena pt-3"
									id="parametros-contrasena">

									<!-- Profile Edit Form -->
									<div class="row">
										<div class="col-lg-8">
											<div class="card mb-4">
												<div class="card-header">Agregar parametros</div>
												<div class="card-body">
													<form th:action="@{/configuracion/guardarConfContrasena}"
														enctype="multipart/form-data" method="POST" id="ConfContrasena">
														<div class="form-group">
															<label for="longitud">Longitud de la contraseña:</label>
															<input type="number" class="form-control" id="longitud"
																name="longitud" required
																placeholder="Número de la longitud de la contaseña"
																autocomplete="off">
														</div>

														<div class="form-group">
															<label for="mayusculas">Cantidad de mayusculas:</label>
															<input type="number" class="form-control" id="mayusculas"
																name="mayusculas" required
																placeholder="Cantidad de mayusculas" autocomplete="off"
																onfocusout="numMaximoParametrosContrasena()">
														</div>

														<div class="form-group">
															<label for="minusculas">Cantidad de minusculas:</label>
															<input type="number" class="form-control" id="minusculas"
																name="minusculas" required
																placeholder="Cantidad de minusculas" autocomplete="off"
																onfocusout="numMaximoParametrosContrasena()">
														</div>

														<div class="form-group">
															<label for="numeros">Cantidad de dígitos numéricos:</label>
															<input type="number" class="form-control" id="numeros"
																name="numeros" required
																placeholder="Cantidad de dígitos numéricos"
																autocomplete="off"
																onfocusout="numMaximoParametrosContrasena()">
														</div>

														<div class="form-group">
															<label for="caracteres">Cantidad de caracteres
																especiales:</label> <input type="number"
																class="form-control" id="caracteres" name="caracteres"
																required placeholder="Cantidad de caracteres especiales"
																autocomplete="off"
																onfocusout="numMaximoParametrosContrasena()">
														</div>

														<br>
														<div class="col-sm-2">
															<button type="submit" onclick="mensaje()"
																class="btn btn-primary">Guardar</button>
														</div>
													</form>
												</div>
											</div>


										</div>
										<div class="col-lg-4">
											<div class="card mb-4">
												<div class="card-header">Parametros actuales</div>
												<div class="card-body">
													<div class="form-group">
														<label>Longitud de la contraseña:</label> <input type="number"
															class="form-control" th:value="${longitud}"
															readonly="readonly">
													</div>

													<div class="form-group">
														<label>Cantidad de mayusculas:</label> <input type="number"
															class="form-control" th:value="${mayusculas}"
															readonly="readonly">
													</div>

													<div class="form-group">
														<label>Cantidad de minusculas:</label> <input type="number"
															class="form-control" th:value="${minusculas}"
															readonly="readonly">
													</div>

													<div class="form-group">
														<label>Cantidad de dígitos numéricos:</label> <input
															type="number" class="form-control" th:value="${numeros}"
															readonly="readonly">
													</div>

													<div class="form-group">
														<label>Cantidad de caracteres especiales:</label> <input
															type="number" class="form-control" th:value="${caracteres}"
															readonly="readonly">
													</div>
												</div>
											</div>


										</div>
									</div><!-- End Profile Edit Form -->

								</div>



								<div class="tab-pane fade pt-3" id="cambiar-contrasena">
									<!-- Change Password Form -->
									<form:form th:action="@{/configuracion/guardarContrasena}" method="post">
										<div class="form-group">
											<label for="contrasena">Ingresa la contraseña:</label> <input type="text"
												class="form-control" id="contrasena" name="contrasena" required
												placeholder="Contraseña" autocomplete="off">
										</div>
										<!--Especifica el periodo en días que tiene permitido estar activa . -->

										<div class="col-sm-2">
											<button type="button" onclick="generarContrasena()"
												class="btn btn-primary">Guardar</button>
										</div>
									</form:form><!-- End Change Password Form -->

								</div>

							</div><!-- End Bordered Tabs -->

						</div>
					</div>

				</div>
			</div>
		</div>
	</section>

	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="http://code.jquery.com/jquery-1.10.2.js"></script>
		<script src="http://code.jquery.com/ui/1.11.2/jquery-ui.js"></script>
		<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
		<script th:src="@{/js/configuracion.js}"></script>
	</th:block>

</body>

</html>
