<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>

	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Configuración de Contraseña</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Configuración</li>
					<li class="breadcrumb-item active">Contraseña</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body pt-3">
				<!-- Bordered Tabs -->
				<ul class="nav nav-tabs nav-tabs-bordered" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active" data-bs-toggle="tab" data-bs-target="#parametros-contrasena"
							type="button" role="tab" aria-selected="true">Editar Parámetros</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" data-bs-toggle="tab" data-bs-target="#cambiar-contrasena" type="button"
							role="tab" aria-selected="false">Contraseña Default</button>
					</li>
				</ul>

				<div class="tab-content pt-4">

					<!-- Parámetros -->
					<div class="tab-pane fade show active" id="parametros-contrasena" role="tabpanel">
						<div class="row">
							<div class="col-lg-8">
								<div class="card border mb-4">
									<div class="card-header bg-light fw-bold">Configurar Parámetros</div>
									<div class="card-body pt-3">
										<form th:action="@{/configuracion/guardarConfContrasena}"
											enctype="multipart/form-data" method="POST" id="ConfContrasena"
											class="row g-3">

											<div class="col-md-6">
												<label for="longitud" class="form-label">Longitud mínima</label>
												<input type="number" class="form-control" id="longitud" name="longitud"
													required placeholder="Ej: 8" autocomplete="off">
											</div>

											<div class="col-md-6">
												<label for="mayusculas" class="form-label">Mínimo mayúsculas</label>
												<input type="number" class="form-control" id="mayusculas"
													name="mayusculas" required placeholder="Ej: 1" autocomplete="off"
													onfocusout="numMaximoParametrosContrasena()">
											</div>

											<div class="col-md-6">
												<label for="minusculas" class="form-label">Mínimo minúsculas</label>
												<input type="number" class="form-control" id="minusculas"
													name="minusculas" required placeholder="Ej: 1" autocomplete="off"
													onfocusout="numMaximoParametrosContrasena()">
											</div>

											<div class="col-md-6">
												<label for="numeros" class="form-label">Mínimo números</label>
												<input type="number" class="form-control" id="numeros" name="numeros"
													required placeholder="Ej: 1" autocomplete="off"
													onfocusout="numMaximoParametrosContrasena()">
											</div>

											<div class="col-md-6">
												<label for="caracteres" class="form-label">Mínimo caracteres
													especiales</label>
												<input type="number" class="form-control" id="caracteres"
													name="caracteres" required placeholder="Ej: 1" autocomplete="off"
													onfocusout="numMaximoParametrosContrasena()">
											</div>

											<div class="col-12 text-end mt-4">
												<button type="submit" onclick="mensaje()" class="btn btn-primary">
													<i class="bi bi-save me-1"></i> Guardar
												</button>
											</div>
										</form>
									</div>
								</div>
							</div>

							<div class="col-lg-4">
								<div class="card border mb-4">
									<div class="card-header bg-light fw-bold">Parámetros Actuales</div>
									<div class="card-body pt-3">
										<div class="mb-2 row">
											<label class="col-sm-8 col-form-label">Longitud:</label>
											<div class="col-sm-4">
												<input type="text" class="form-control-plaintext text-end fw-bold"
													th:value="${longitud}" readonly>
											</div>
										</div>
										<div class="mb-2 row">
											<label class="col-sm-8 col-form-label">Mayúsculas:</label>
											<div class="col-sm-4">
												<input type="text" class="form-control-plaintext text-end fw-bold"
													th:value="${mayusculas}" readonly>
											</div>
										</div>
										<div class="mb-2 row">
											<label class="col-sm-8 col-form-label">Minúsculas:</label>
											<div class="col-sm-4">
												<input type="text" class="form-control-plaintext text-end fw-bold"
													th:value="${minusculas}" readonly>
											</div>
										</div>
										<div class="mb-2 row">
											<label class="col-sm-8 col-form-label">Números:</label>
											<div class="col-sm-4">
												<input type="text" class="form-control-plaintext text-end fw-bold"
													th:value="${numeros}" readonly>
											</div>
										</div>
										<div class="mb-2 row">
											<label class="col-sm-8 col-form-label">Especiales:</label>
											<div class="col-sm-4">
												<input type="text" class="form-control-plaintext text-end fw-bold"
													th:value="${caracteres}" readonly>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- Cambiar Contraseña Default -->
					<div class="tab-pane fade" id="cambiar-contrasena" role="tabpanel">
						<div class="card border">
							<div class="card-body pt-3">
								<h5 class="card-title">Establecer Contraseña por Defecto</h5>
								<form th:action="@{/configuracion/guardarContrasena}" method="post" class="row g-3">
									<div class="col-md-6">
										<label for="contrasena" class="form-label">Nueva contraseña</label>
										<input type="text" class="form-control" id="contrasena" name="contrasena"
											required placeholder="Ingrese nueva contraseña" autocomplete="off">
									</div>
									<div class="col-12 text-end">
										<button type="button" onclick="generarContrasena()" class="btn btn-primary">
											<i class="bi bi-key-fill me-1"></i> Guardar
										</button>
									</div>
								</form>
							</div>
						</div>
					</div>

				</div><!-- End Tabs -->
			</div>
		</div>
	</section>

	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/componentes/titulo.js}"></script>
		<script th:src="@{/js/configuracion.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>

</body>

</html>
