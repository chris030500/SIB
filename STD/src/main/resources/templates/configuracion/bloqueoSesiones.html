<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2>Parametros de bloqueo de sesiones</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-8">
					<div class="card mb-4">
						<div class="card-header">Agregar parametros</div>
						<div class="card-body">
							<form th:action="@{/configuracion/guardarBloqueoSesiones}" method="post">
								<div class="form-group">
									<label for="intentos">Número máximo de intentos:</label> <input type="number"
										class="form-control" id="intentos" name="intentos" required
										placeholder="Intentos de inicio de sesión fallidos" autocomplete="off">
								</div>
								<!--Especifica el periodo de tiempo durante el cual un usuario no puede iniciar sesión 
								en la aplicación después de exceder el número máximo de intentos de inicio de sesión fallidos. -->
								<div class="form-group">
									<label for="pBloqueo">Periodo de bloqueo (MINUTOS):</label> <input type="number"
										class="form-control" id="pBloqueo" name="pBloqueo" required
										placeholder="Periodo durante el cual el usuario no puede iniciar sesión"
										autocomplete="off">
								</div>

								<!--Especifica el periodo durante el cual el usuario puede intentar iniciar sesión 
								en la aplicación. Cuando se supera el número máximo de intentos de inicio de sesión fallidos 
								dentro de este periodo, la cuenta se bloquea. -->
								<div class="form-group">
									<label for="pIntentos">Periodo de intentos de inicio de sesión (MINUTOS):</label>
									<input type="number" class="form-control" id="pIntentos" name="pIntentos" required
										placeholder="Periodo se supera el número máximo de intentos de inicio de sesión fallidos dentro de este periodo, la cuenta se bloquea."
										autocomplete="off">
								</div>

								<br>
								<div class="col-sm-2">
									<button type="submit" class="btn btn-success">Guardar</button>
								</div>
							</form>
						</div>
					</div>
				</div>

				<div class="col-lg-4">
					<div class="card mb-4">
						<div class="card-header">Parametros actuales</div>
						<div class="card-body">
							<div class="form-group">
								<label for="intentos">Número máximo de intentos:</label> <input type="number"
									class="form-control" th:value="${intentos}"
									placeholder="Intentos de inicio de sesión fallidos">
							</div>

							<div class="form-group">
								<label for="pBloqueo">Periodo de bloqueo (MINUTOS):</label> <input type="number"
									class="form-control" th:value="${pBloqueo}"
									placeholder="Periodo durante el cual el usuario no puede iniciar sesión">
							</div>

							<div class="form-group">
								<label for="pIntentos">Periodo de intentos de inicio de sesión (MINUTOS):</label> <input
									type="number" class="form-control" th:value="${pIntentos}" placeholder="Periodo se supera el número máximo de intentos de inicio de sesión fallidos 
								dentro de este periodo, la cuenta se bloquea.">
							</div>
						</div>
					</div>
				</div>


			</div>
		</div>
	</section>

</body>

</html>
