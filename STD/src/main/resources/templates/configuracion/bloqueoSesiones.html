<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2>Parametros de bloqueo de sesiones</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-8">
					<div class="card mb-4">
						<div class="card-header">Agregar parametros</div>
						<div class="card-body">
							<form th:action="@{/configuracion/guardarBloqueoSesiones}" method="post">
								<div class="form-group">
									<label for="intentos">Número máximo de intentos:</label> <input type="number"
										class="form-control" id="intentos" name="intentos" required
										placeholder="Intentos de inicio de sesión fallidos" autocomplete="off">
								</div>
								<!--Especifica el periodo de tiempo durante el cual un usuario no puede iniciar sesión 
								en la aplicación después de exceder el número máximo de intentos de inicio de sesión fallidos. -->
								<div class="form-group">
									<label for="pBloqueo">Periodo de bloqueo (MINUTOS):</label> <input type="number"
										class="form-control" id="pBloqueo" name="pBloqueo" required
										placeholder="Periodo durante el cual el usuario no puede iniciar sesión"
										autocomplete="off">
								</div>

								<!--Especifica el periodo en días que tiene permitido estar activa . -->
								<div class="form-group">
									<label for="pDias">Periodo que se encontrará activa la cuenta (días):</label>
									<input type="number" class="form-control" id="pDias" name="pDias" required
										placeholder="Periodo para la inactividad de la cuenta, la cuenta se bloquea."
										autocomplete="off">
								</div>

								<br>
								<div class="col-sm-2">
									<button type="submit" onclick="guardarConfSesion()" class="btn btn-success">Guardar</button>
								</div>
							</form>
						</div>
					</div>
				</div>

				<div class="col-lg-4">
					<div class="card mb-4">
						<div class="card-header">Parametros actuales</div>
						<div class="card-body">
							<div class="form-group">
								<label for="intentos">Número máximo de intentos:</label> <input type="number"
									class="form-control" th:value="${intentos}"
									placeholder="Intentos de inicio de sesión fallidos">
							</div>

							<div class="form-group">
								<label for="pBloqueo">Periodo de bloqueo (MINUTOS):</label> <input type="number"
									class="form-control" th:value="${pBloqueo}"
									placeholder="Periodo durante el cual el usuario no puede iniciar sesión">
							</div>

							<div class="form-group">
								<label for="pDias">Periodo que se encontrará activa la cuenta (días):</label> <input
									type="number" class="form-control" th:value="${pDias}" 
									placeholder="Periodo para la inactividad de la cuenta, la cuenta se bloquea.">
							</div>
						</div>
					</div>
				</div>


			</div>
		</div>
	</section>
	
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="http://code.jquery.com/jquery-1.10.2.js"></script>
		<script src="http://code.jquery.com/ui/1.11.2/jquery-ui.js"></script>
		<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
		<script th:src="@{/js/configuracion.js}"></script>
	</th:block>

</body>

</html>
