<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Bloqueo de Sesiones</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Configuración</li>
					<li class="breadcrumb-item active">Bloqueo Sesiones</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="row">
			<div class="col-lg-8">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Configurar Parámetros</h5>

						<form th:action="@{/configuracion/guardarBloqueoSesiones}" method="post" class="row g-3">

							<div class="col-12">
								<label for="intento" class="form-label">Número máximo de intentos</label>
								<input type="number" class="form-control" id="intento" name="intento"
									placeholder="Ej: 3" autocomplete="off">
								<div class="form-text">Intentos de inicio de sesión fallidos antes del bloqueo.</div>
							</div>

							<div class="col-12">
								<label for="pBloqueo" class="form-label">Periodo de bloqueo (Minutos)</label>
								<input type="number" class="form-control" id="pBloqueo" name="pBloqueo"
									placeholder="Ej: 30" autocomplete="off">
								<div class="form-text">Tiempo durante el cual el usuario no puede iniciar sesión.</div>
							</div>

							<div class="col-12">
								<label for="pDias" class="form-label">Vigencia de la cuenta (Días)</label>
								<input type="number" class="form-control" id="pDias" name="pDias" placeholder="Ej: 90"
									autocomplete="off">
								<div class="form-text">Periodo de inactividad tras el cual la cuenta se bloquea.</div>
							</div>

							<div class="col-12 text-end">
								<button type="button" onclick="guardarConfSesion()" class="btn btn-primary">
									<i class="bi bi-save me-1"></i> Guardar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div class="col-lg-4">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Parámetros Actuales</h5>

						<div class="mb-3">
							<label class="form-label fw-bold">Máximo de intentos</label>
							<input type="text" class="form-control bg-light" th:value="${intentos}" readonly>
						</div>

						<div class="mb-3">
							<label class="form-label fw-bold">Periodo bloqueo (min)</label>
							<input type="text" class="form-control bg-light" th:value="${pBloqueo}" readonly>
						</div>

						<div class="mb-3">
							<label class="form-label fw-bold">Vigencia cuenta (días)</label>
							<input type="text" class="form-control bg-light" th:value="${pDias}" readonly>
						</div>

					</div>
				</div>
			</div>
		</div>

	</section>

	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/configuracion.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>

</body>

</html>
