<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="border p-2 card">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Calculo EPRC</h2>
						</div>
					</div>
				</div>
			</div>
			<div id="divConfiguracion" class="" style="margin-top : 15px ">
				<fieldset class="border p-2">
					<legend class="float-none w-auto p-2">Proceso EPRC</legend>
					<div class="row" style="margin-top : 5px ">
						<div class="col-lg-10">
						</div>
						<div class="col-lg-2">
							<label>Ver Documentos</label>
							<button class='btn btn-info' tabindex='0' data-bs-toggle='modal' title='Adjuntar Archivos'
								data-bs-target='#modalAdjuntos' aria-controls='table-datatable' type='button'
								onclick='adjuntarFiles(2)' data-tooltip='Add'>
								<i class='bi bi-files'></i>
							</button>

						</div>


					</div>
					<div id="liveAlertPlaceholderEPRC"></div>
					<div class="row" style="margin-top : 5px ">
						<div class="col-md-3">
							<label>Procesar información:</label>
						</div>
						<div class="col-md-4">
							<form th:action="@{/contabilidad/procesar-EPRC}" method="post" id="procesarFormEPRC">
								<button type="button" id="btnProcesandoEPRC" class="btn btn-secondary"
									onclick="submitBtnEPRC(this,1)">
									<i class="fa-solid fa-circle-play"></i>
								</button>
							</form>
						</div>
					</div>
					<div class="row" style="margin-top : 5px ">
						<div class="col-md-3">
							<label>Descargar reporte: </label>
						</div>
						<div class="col-md-4">
							<form th:action="@{/contabilidad/reporte-EPRC}" method="post" id="reporteForm">
								<button type="button" id="btnProcesando" class="btn btn-secondary"
									onclick="submitBtnEPRC(this,2)">
									<i class="fa-sharp fa-solid fa-file-arrow-down"></i>
								</button>
							</form>
						</div>
					</div>
					<div class="row" style="margin-top : 5px ">
						<div class="col-md-3">
							<label>¿La información del reporte es correcta?</label>
						</div>
						<div class="col-md-4">
							<form th:action="@{/contabilidad/guardar-voboProcesoEPRC}" method="post" id="voboForm">
								<div class="row" style="margin-top : 5px ">
									<div class="col-md-2">
										<div class="form-check">
											<input class="form-check-input" type="radio" name="rbtnDefault" id="rbtnNo"
												checked>
											<label class="form-check-label" for="rbtnSi">
												NO
											</label>
										</div>
									</div>
									<div class="col-md-2">
										<div class="form-check">
											<input class="form-check-input" type="radio" name="rbtnDefault" id="rbtnSi">
											<label class="form-check-label" for="rbtnSi">
												SI
											</label>
										</div>
									</div>
									<div class="col-md-8">
										<button type="button" id="btnProcesando" class="btn btn-success"
											onclick="submitFormEPRC(this)">
											Guardar
										</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</fieldset>
			</div>

			<div id="divConfiguracion" class="" style="margin-top : 15px ">
				<input type="hidden" id="listaHistProcesoEPRC" name="listaHistProceso"
					th:value="${listaHistProcesoEPRC}">
				<form id="reporteHistorico" th:action="@{/contabilidad/reporte-costoNetoFinanciadoHist}" method="post">
					<fieldset class="border p-2">
						<legend class="float-none w-auto p-2">Historico Proceso EPRC</legend>
						<div class="row" style="margin-top : 5px ">
							<div class="table-responsive">
								<table class="table table-sm table-striped" id="tblProcesoGeneradorEPRC">
									<thead>
										<tr>
											<th>Cierre del Mes</th>
											<th>Fecha de corte</th>
											<th>Usuario vo.bo</th>
											<th>Fecha vo.bo</th>
											<th style="text-align: center;">Acciones</th>
										</tr>
									</thead>
									<tbody>
									</tbody>
								</table>
							</div>
						</div>
					</fieldset>
				</form>
			</div>

			<div class="modal fade" id="modalAdjuntos" data-backdrop="static" tabindex="-1" data-keyboard="false"
				role="dialog">
				<div class="modal-dialog modal-xl modal-dialog-centered">
					<div class="modal-content">
						<fieldset class="border p-2">
							<div class="modal-body">
								<div id="layout-tab1" class="" >
									<fieldset class="border p-2">
										<legend class="float-none w-auto p-2">Carga Layout</legend>
										<div class="row" style="margin-top : 15px ">
											<div class="col-12">
												<form id="uploadForm" enctype="multipart/form-data">
													<div class="form-group">
														<label for="fileUpload">Seleccionar archivo Excel:</label>
														<input type="file" id="fileUpload" name="fileUpload"
															accept=".xlsx, .xls" class="form-control" />
													</div>
													<button type="submit" class="btn btn-primary mt-2">Subir
														archivo</button>
												</form>
											</div>
										</div>

										<div class="row" style="margin-top: 30px;">
											<div class="col-12">
												<h5>Archivos Subidos</h5>
												<ul id="fileList" class="list-group">
													<li class="list-group-item">No hay archivos subidos.</li>
												</ul>
											</div>
										</div>
									</fieldset>
								</div>

							</div>
							<div class="modal-footer">
								<h1 style="text-align: center; font-size: 12px; font-weight: bold; color: black;"
									id="lblCargaAdjunto"></h1>
								<button type="button" class="btn btn-primary" id="btnGuardarFile">Guardar</button>
								<button type="button" class="btn btn-primary" data-dismiss="modal"
									id="btnCerrarAdjunto">Cerrar</button>
							</div>
						</fieldset>
					</div>
				</div>
			</div>


		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/jquery-3.5.1.js}"></script>
		<script th:src="@{/js/dataTables.bootstrap.min.js}"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<!--<script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.26.10/dist/sweetalert2.all.min.js"></script>-->
		<script th:src="@{/js/contabilidad/inicioContabilidad.js}"></script>
		<script th:src="@{/js/contabilidad/calculoEPRC.js}"></script>
	</th:block>
</body>


</html>
