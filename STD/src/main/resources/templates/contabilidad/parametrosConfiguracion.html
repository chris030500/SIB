<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/vendor/css/spinner.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="border p-2 card">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Parametros Configuracion</h2>
						</div>
					</div>
				</div>
			</div>

			<div class="p-4 border rounded-3 mb-4">
				<ul class="nav nav-pills" id="pntConf" role="tablist">
					<li class="nav-item" role="presentation">
						<button onclick="ocultarMostrar(this)" class="nav-link active" id="params-tab"
							data-bs-toggle="tab" type="button" role="tab" aria-selected="true">Parametros
							Generales</button>
					</li>
					<li class="nav-item" role="presentation">
						<button onclick="ocultarMostrar(this)" class="nav-link" id="layout-tab" data-bs-toggle="tab"
							type="button" role="tab" aria-selected="false" tabindex="-1">Carga Layout</button>
					</li>
				</ul>
			</div>
			<div id="pant-tabs">
				<div id="params-tab1" class="" style="display: block;" for="1">
					<input type="hidden" id="lista_BC" name="lista_BC" th:value="${lista_BC}">
					<fieldset class="border p-2">
						<legend class="float-none w-auto p-2">Gastos para monto amortizado</legend>
						<div id="mensajeCostoAmortizado"></div>
						<form th:action="@{/contabilidad/guardar-Costos}" method="post" id="procesarForm">
						<div class="row" style="margin-top : 15px ">
							<div class="col-md-2">
								<label><b>Costo Unitario BC: </b></label>
							</div>
							<div class="col-md-2">
								<input type="number" class="form-control" id="costoBC" min="0" step="1" th:required="true" 
										name="costo_unitario_BC" th:value="${costoBuro}">
							</div>
							<div class="col-md-2">
								<label><b>Costo Unitario Adviser: </b></label>
							</div>
							<div class="col-md-2">
								<input type="number" class="form-control" id="costoAdvicer" min="0" step="1" th:required="true" 
										name="costo_unitario_Adviser" th:value="${costoAdviser}">
							</div>
							<div class="col-md-3">
							
								<button type="button" id="btnGuardarCostos" class="btn btn-success" onclick="costos(this)">
											Guardar
								</button>
							
							</div>
						   </div>	
						</form>
						<div class="row" style="margin-top : 15px ">
							<div class="col-lg-4">
								<button class="btn btn-secundary bg-info text-white" tabindex="0" data-bs-toggle="modal"
									title="Agregar" data-bs-target="#registroCatalogo" aria-controls="table-datatable"
									type="button" data-tooltip="Add" onclick="limpiarFormulario()">
									<i class="fa fa-plus-circle"></i> Gastos por Productos
								</button>
							</div>
							<div class="col-lg-4"></div>
							<div class="col-lg-4"></div>
						</div>
						<div class="row" style="margin-top : 15px ">
							<input type="hidden" id="listaGastos" name="listaGastos">
							<form id="actualizacionGastos" th:action="@{/contabilidad/obtener-gastos}" method="post">
							<div class="table-responsive">
								<table class="table table-sm table-striped" id="tblConfiguracion">
									<thead>
										<tr>
											<th>Concepto</th>
											<th>Producto</th>
											<th>Monto Inicial</th>
											<th>Monto Final</th>
											<th>Estatus</th>
											<th style="text-align: center;">Acciones</th>
										</tr>
									</thead>
									<tbody>
									</tbody>
								</table>
							</div>
							</form>
						</div>
					</fieldset>
				</div>
				<div id="layout-tab1" class="" style="display: none;" for="2">
					<fieldset class="border p-2">
						<legend class="float-none w-auto p-2">Carga Layout</legend>
						<div class="row" style="margin-top : 15px "></div>
					</fieldset>
				</div>
			</div>
		</div>
		<!--Modal Cataogo-->
		<div class="modal fade" id="registroCatalogo" data-bs-backdrop="static" data-bs-keyboard="false">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<fieldset class="border p-2">
						<div class="modal-header">
							<div class="col-md-11">
								<legend class="float-none w-auto p-2">Catalogo Consulta Buro - Adviser</legend>
							</div>
							<div class="col-md-1">
								<button type="button" class="btn-close" onclick="cerrarModal(this)" data-dismiss="modal"
								aria-label="Close"></button>
							</div>
							
						</div>
						<div class="modal-body">
							<div id="liveAlertPlaceholder"></div>
							<form th:action="@{/contabilidad/guardar-CatalogoBC}" method="post" id="configuracionForm">
								<input type="hidden" id="gastoIde" name="gastoIde">
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-4">
										<label for="lblConcepto" name="lblConcepto">Concepto:</label>
									</div>
									<div class="col-md-8">
										<select class="form-control" id="slcConcepto" name="Concepto" onchange="costoUnitarioS(this)">
											<option value="0">Seleccione</option>
											<option th:each="conceptos : ${cat_conceptos}" th:value="${conceptos.i_opcion}"
                                              th:text="${conceptos.v_valor}">
                                              </option>
										</select>
									</div>
								</div>
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-4">
										<label for="lblProducto" name="lblProducto">Productos:</label>
									</div>
									<div class="col-md-8">
										<select class="form-control" id="slcProducto" name="Productos">
											<option value="0">Seleccione</option>
											<option th:each="producto : ${cat_productos}" th:value="${producto.i_producto_creditoid}"
                                              th:text="${producto.vc_descripcion_producto}">
                                              </option>
										</select>
									</div>
								</div>
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-4">
										<label for="lblMontoInicial" name="lblMontoInicial">Monto Inicial:</label>
									</div>
									<div class="col-md-8">
										<input type="number" class="form-control" id="montoInicial" min="0" step="1" th:required="true" 
										name="montoInicial" th:value="${montoInicial != null ? montoInicial : 0}">
									</div>
								</div>
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-4">
										<label for="lblMontoFinal">Monto final:</label>
									</div>
									<div class="col-md-8">
										<input type="number" class="form-control" id="montoFinal" min="0" step="1" th:required="true" 
										name="montoFinal" th:value="${montoFinal != null ? montoFinal : 0}">
									</div>
								</div>
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-4">
										<label for="lblCostoUnitario" name="lblCostoUnitario">Costo Unitario:</label>
									</div>
									<div class="col-md-8">
										<select class="form-control" id="slcCostoUnitario" name="costoUnitario" disabled>
											<option value="0">Seleccione</option>
											<option th:each="costo_unitario : ${cat_costo_unitario}" th:value="${costo_unitario.i_opcion}"
                                              th:text="${costo_unitario.v_valor}">
                                              </option>
										</select>
									</div>
								</div>
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-6"></div>
									<div class="col-md-6 d-flex justify-content-end">
										<button type="button" id="btnProcesando" class="btn btn-success" onclick="submitForm(this)">
											Registrar
										</button>
									</div>
								</div>
							</form>
						</div>
					</fieldset>
				</div>
			</div>
		</div>
		<!--Ctalogo-->
	</section>
	<th:block layout:fragment="page-scripts">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/jquery-3.5.1.js}"></script>
		<script th:src="@{/js/dataTables.bootstrap.min.js}"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<!--<script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.26.10/dist/sweetalert2.all.min.js"></script>-->
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/contabilidad/inicioContabilidad.js}"></script>
		<script th:src="@{/js/contabilidad/parametrosGeneral.js}"></script>
	</th:block>
</body>


</html>
