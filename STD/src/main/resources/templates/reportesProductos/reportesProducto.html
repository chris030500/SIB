<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Reportes de Productos</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Reportes</li>
					<li class="breadcrumb-item active">Productos</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Generar Reporte</h5>

				<div id="divGenerarReporte">
					<div class="row g-3 mb-4 align-items-end">
						<div class="col-md-4">
							<label class="form-label">Tipo de Reporte</label>
							<select class="form-select" id="idReporteProducto">
								<option value="0">Seleccione...</option>
								<option th:each="reporte : ${cat_reportes_produtos}" th:value="${reporte.i_opcion}"
									th:text="${reporte.v_valor}"></option>
							</select>
						</div>
						<div class="col-md-3">
							<label class="form-label">Fecha Inicio</label>
							<input class="form-control" type="date" id="dtFechaInicio">
						</div>
						<div class="col-md-3">
							<label class="form-label">Fecha Fin</label>
							<input class="form-control" type="date" id="dtFechaFin">
						</div>
						<div class="col-md-2">
							<button class="btn btn-primary w-100" type="button" onclick="generarReporte()">
								<i class="bi bi-filetype-exe me-1"></i> Generar
							</button>
						</div>
					</div>
				</div>

			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/reporteProductos/reporteProducto.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
