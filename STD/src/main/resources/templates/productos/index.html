<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Productos</h2>
						</div>
					</div>
				</div>
			</div>

			
			<ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">Inicio</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Producto-Documento</button>
    </li>
   
  </ul>
  <div class="tab-content" id="pills-tabContent">
    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
    <div class="col-4">
   
											<label for="nombreUsuario" class="form-label">Numero de producto:</label> 
											<input type="text" class="form-control" id="nombreUsuario" required>
										</div>
										<div class="col-4">
											<label for="productos" class="form-label">Nombre del producto:</label>
											<select class="form-select" id="productos" name="tipoUsuario">
												<option value="0">Seleccione un producto</option>
												<option th:each="rol : ${productos}" th:text="${rol.vc_nombre_rol}"
													th:value="${rol.pk_id_rol}" />
											</select>
 <fieldset class="row mb-3">
    <legend class="col-form-label col-sm-2 pt-0">Tipo de producto</legend>
    <div class="col-sm-10">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1" value="option1" checked>
        <label class="form-check-label" for="gridRadios1">
          Colocacion
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2" value="option2">
        <label class="form-check-label" for="gridRadios2">
          Captacion
        </label>
      </div>
     
    </div>
  </fieldset>
										</div>
										<p></p>

<table class="table table-bordered table-striped">

						<thead>
							<tr>
								<th>Nombre Producto</th>
								<th>Descripcion</th>
								<th>Estatus</th>
								<th class="text-center">Opciones</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="producto: ${productos}">

								<td th:text="${producto.vc_nombre_producto}">
								<td th:text="${producto.vc_descripcion_producto}">
								<td th:text="${producto.vc_estatus}">

								<td class="text-center">

								

									<!-- Botón para eliminar registro del producto -->
									<button class="btn btn-danger btn-sm" id="idproducto" name="idproducto"
										onclick="estatusPerfil(this.value)" href="#" title="Eliminar producto"
										data-toggle="modal" data-target="#" th:value="${producto.pk_id_producto}">
										<i class="fas fa-trash"></i>
									</button>

								</td>

							</tr>

							<tr th:if="${#lists.isEmpty(productos)}">
								<td colspan="6">
									A&uacute;n no se registran productos en el sistema
								</td>
							</tr>

						</tbody>



					</table>
    </div>
    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
     <!--
        <form class="row g-6">
							<div class="col-md-5">
								<input type="text" placeholder="Ingresa el documento a buscar" class="form-control" id="solicitudCredito">
							</div>
							<div class="col-md-4">
								<button type="submit" class="btn btn-primary">Buscar</button>
							</div>
							</form> -->
							<div class="d-flex gap-5 justify-content-center">
							
								<div class="list-group mx-0 w-auto">
									<form>
							
										<div class="row mb-3">
													<label for="productos" class="form-label">Nombre del producto:</label>
											<div class="col-sm-10">
													<select class="form-select" id="productos" name="tipoProducto">
											<option value="0">Seleccione un producto</option>
											<option th:each="producto : ${productos}" th:text="${producto.vc_nombre_producto}" th:value="${producto.pk_id_producto}" />
										</select>
											</div>
										</div>
								
									
							
							
									</form>
								</div>
								<div class="list-group mx-0 w-auto">
									<div class="container">
										<div class="row">
											<div class="col-12">
												<table class="table table-bordered">
													<thead>
														<tr>
															<th scope="col"><input type="checkbox" name="brand"></th>
															<th scope="col">Documento</th>
            </tr>
          </thead>
          <tbody>
          				<tr th:each="producto: ${productos}">

								<td><input class="seleccionar" type="checkbox" th:value="*{entity.seleccionado}" th:onclick="'javascript:check('+ *{entity.id} +')'"/></td>
								<td th:text="${producto.vc_nombre_doc}">
								

								

							</tr>

							<tr th:if="${#lists.isEmpty(productos)}">
								<td colspan="6">
									A&uacute;n no se registran productos en el sistema
								</td>
							</tr>
       
          </tbody>
        </table>
      </div>
    </div>
  </div>
    </div>
  
  
  </div>
  <div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button class="btn btn-primary me-md-2" type="button">Guardar</button>
  </div>
    </div>

  </div>
			
			
		
	</section>
	<th:block layout:fragment="page-scripts">
	<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
	<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>	
		<!--JavaScript-->
	</th:block>
</body>
</html>
