<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Productos</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Productos</li>
					<li class="breadcrumb-item active">Gestión de Productos</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Filtros y Búsqueda</h5>

				<form class="row g-3 mb-4">
					<div sec:authorize="hasRole('ROLE_PRODUCTOS') or hasRole('ROLE_ADMIN')" class="col-md-6">
						<label for="opciones" class="form-label">Tipo Producto</label>
						<select class="form-select" id="opciones">
							<option value="0">Seleccione</option>
							<option th:each="opcion : ${cat_tipo_producto}" th:value="${opcion.i_opcion}"
								th:text="${opcion.v_valor}"></option>
						</select>
					</div>

					<div class="col-md-6" style="display:none;" id="productoCaptacion">
						<label for="opcionesCaptacion" class="form-label">Productos Captación</label>
						<select class="form-select" id="opcionesCaptacion">
							<option value="0">Seleccione</option>
							<option th:each="opcion : ${cat_prodcuto_captacion}" th:value="${opcion.idproducto}"
								th:text="${opcion.nombreProducto}"></option>
						</select>
					</div>

					<div class="col-md-6" style="display:none;" id="productoColocacion">
						<label for="opcionesColocacion" class="form-label">Productos Colocación</label>
						<select class="form-select" id="opcionesColocacion">
							<option value="0">Seleccione</option>
							<option th:each="opcion : ${cat_prodcuto}" th:value="${opcion.idproducto}"
								th:text="${opcion.nombreProducto}"></option>
						</select>
					</div>

					<div class="col-md-6" style="display:none;" id="diviKYC">
						<label for="iKYC" class="form-label">Identificador KYC <span
								class="text-danger">*</span></label>
						<input id="iKYC" class="form-control" type="text" placeholder="Agregar identificador KYC" />
					</div>

					<div class="col-md-6" style="display:none;" id="divdescripcionProducto">
						<label for="descripcionProducto" class="form-label">Descripción Producto <span
								class="text-danger">*</span></label>
						<input id="descripcionProducto" class="form-control" type="text"
							placeholder="Agregar descripción del producto" />
					</div>

					<div class="col-md-6" style="display:none;" id="contrato">
						<label for="opcionesContrato" class="form-label">Contrato</label>
						<select class="form-select" id="opcionesContrato">
							<option value="0">Seleccione</option>
							<option th:each="opcion : ${listadoContratos}" th:value="${opcion.pk_id_contrato}"
								th:text="${opcion.vc_contrato}"></option>
						</select>
					</div>

					<div sec:authorize="hasRole('ROLE_PRODUCTOS') or hasRole('ROLE_ADMIN')" class="col-12 text-end"
						id="btnAgregar">
						<button type="button" th:onclick="validarVacio()" class="btn btn-primary" id="altaProducto">
							<i class="bi bi-plus-lg me-1"></i> Alta Producto
						</button>
					</div>
				</form>

				<div class="table-responsive">
					<table class="table table-hover" id="productoTable">
						<thead>
							<tr>
								<th style="display:none;">ID</th>
								<th>#</th>
								<th>Producto</th>
								<th>Estatus</th>
								<th>Tipo</th>
								<th>Fecha Registro</th>
								<th>Fecha Cancelación</th>
								<th>Identificador KYC</th>
								<th>Descripción</th>
								<th>Contrato</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="listaProductos:${listaProductos}">
								<td style="display:none;" th:text="${listaProductos.pk_id_producto}"></td>
								<td th:text="${listaProductos.i_no_producto}"></td>
								<td th:text="${listaProductos.vc_nombre_producto}" class="fw-bold"></td>
								<td>
									<span
										th:class="${listaProductos.i_estatus == 1 ? 'badge bg-success' : 'badge bg-secondary'}"
										th:text="${listaProductos.i_estatus == 1 ? 'ACTIVO' : 'INACTIVO'}"></span>
								</td>
								<td th:text="${listaProductos.i_tipo_producto == 1 ? 'COLOCACIÓN' : 'CAPTACIÓN'}"></td>
								<td th:text="${listaProductos.dt_fecha_operacion}"></td>
								<td
									th:text="${listaProductos.dt_fecha_cancelacion == null ? 'Sin registro' : listaProductos.dt_fecha_cancelacion}">
								</td>
								<td th:text="${listaProductos.vc_identificador_kyc}"></td>
								<td th:text="${listaProductos.vc_descripcion_producto}"></td>
								<td
									th:text="${listaProductos.vc_contrato == null ? 'Sin registro' : listaProductos.vc_contrato}">
								</td>
								<td>
									<div class="d-flex gap-1">
										<a sec:authorize="hasRole('ROLE_PRODUCTOS') or hasRole('ROLE_ADMIN')"
											th:href="@{reactivar/}+${listaProductos.i_no_producto}"
											class="btn btn-sm btn-success" data-bs-toggle="tooltip" title="Reactivar">
											<i class="bi bi-check-circle-fill"></i>
										</a>

										<a sec:authorize="hasRole('ROLE_PRODUCTOS') or hasRole('ROLE_ADMIN')"
											th:href="@{eliminar/}+${listaProductos.i_no_producto}"
											class="btn btn-sm btn-danger" data-bs-toggle="tooltip"
											title="Baja Producto">
											<i class="bi bi-x-circle-fill"></i>
										</a>

										<button sec:authorize="hasRole('ROLE_PRODUCTOS') or hasRole('ROLE_ADMIN')"
											class="btn btn-sm btn-info text-white" data-bs-toggle="modal"
											title="Editar Producto" data-bs-target="#basicModalProducto"
											th:onclick="'modalEditarProducto(' + ${listaProductos.pk_id_producto} + ')'">
											<i class="bi bi-pencil-square"></i>
										</button>

										<button sec:authorize="hasRole('ROLE_ARCHIVO') or hasRole('ROLE_ADMIN')"
											class="btn btn-sm btn-secondary" data-bs-toggle="tooltip"
											title="Relacionar Documentos" onclick="documentos(this)" id="btnRelacion">
											<i class="bi bi-ui-checks"></i>
										</button>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<!-- Modal Documentos -->
		<div class="modal fade" id="modalDocumentos" tabindex="-1">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="lblTitulo">Relacionar Documentos</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="table-responsive">
							<table class="table table-hover" id="documentos">
								<thead>
									<tr>
										<th width="50">
											<div class="form-check">
												<input type="checkbox" class="form-check-input" id="idTodos"
													th:value="Todos">
											</div>
										</th>
										<th>Nombre Documento</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="documento: ${listDocumentos}">
										<td>
											<div class="form-check">
												<input type="checkbox" class="form-check-input"
													th:value="${documento.pk_id_documento}"
													th:id="${documento.pk_id_documento}">
											</div>
										</td>
										<td th:text="${documento.vc_nombre_doc}"></td>
									</tr>
								</tbody>
							</table>
						</div>
						<input type="hidden" id="datosRelDoc">
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
							id="btnCancelar">Cancelar</button>
						<button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="btnRelDoc">Relacionar
							Documentos</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Modal Editar Producto -->
		<div class="modal fade" id="basicModalProducto" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Editar Producto</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="edit-form" th:method="post" th:object="${listaProductos}">
							<div class="mb-3">
								<label for="idProductoEditar" class="form-label">Id Producto</label>
								<input type="text" class="form-control" id="idProductoEditar" readonly>
							</div>
							<div class="mb-3">
								<label for="kyc" class="form-label">Identificador KYC</label>
								<input type="text" class="form-control" id="kyc">
							</div>
							<div class="mb-3">
								<label for="descripcion" class="form-label">Descripción del producto</label>
								<input type="text" class="form-control" id="descripcion">
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
						<button type="button" onclick="editaProducto()" class="btn btn-primary">Guardar</button>
					</div>
				</div>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/jquery.min.js}"></script>
		<script th:src="@{/js/producto/producto.js}"></script>
		<script th:src="@{/js/datatables.min.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/producto/dataTableProducto.js}"></script>
	</th:block>
</body>

</html>
