<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
    <meta charset="UTF-8">
    <title>Metas y Comisiones</title>
</head>

<body>
<section class="content" layout:fragment="page-content">
    <div class="container">
        <div class="card mb-3">
            <div class="card-body">
                <h4 class="card-title mb-0">Metas y Comisiones - Gestion de Relaciones</h4>
                <small class="text-muted">Region -> Sucursal -> Colaborador -> Puesto -> Productos</small>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Carga masiva desde Excel</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Catalogo sucursales</label>
                        <input type="file" id="sucursalesFile" class="form-control" accept=".xlsx,.xls" />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Catalogo ubicacion empleados</label>
                        <input type="file" id="empleadosFile" class="form-control" accept=".xlsx,.xls" />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Catalogo puestos-productos</label>
                        <input type="file" id="puestosProductosFile" class="form-control" accept=".xlsx,.xls" />
                    </div>
                    <div class="col-12">
                        <button id="btnCargarCatalogos" class="btn btn-success">Cargar y generar relacion</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Region</label>
                        <select id="regionSelect" class="form-select">
                            <option value="">Selecciona una region</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Sucursal</label>
                        <select id="sucursalSelect" class="form-select" disabled>
                            <option value="">Selecciona una sucursal</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Colaborador</label>
                        <select id="colaboradorSelect" class="form-select" disabled>
                            <option value="">Selecciona un colaborador</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Puesto</label>
                        <select id="puestoSelect" class="form-select" disabled>
                            <option value="">Selecciona un puesto</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Productos asignados al puesto</h5>
                        <table class="table table-sm table-bordered" id="tablaAsignados">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>No. Producto</th>
                                    <th>Nombre</th>
                                    <th>Accion</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Productos disponibles</h5>
                        <table class="table table-sm table-bordered" id="tablaDisponibles">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>No. Producto</th>
                                    <th>Nombre</th>
                                    <th>Accion</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="msgBox" class="alert" style="display:none"></div>
    </div>
</section>

<th:block layout:fragment="page-scripts">
    <script th:src="@{/js/metasComisiones/relaciones.js}"></script>
</th:block>
</body>
</html>
