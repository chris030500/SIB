<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Solo scripts específicos de esta página, el resto viene del layout -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Usuarios</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Administración</li>
					<li class="breadcrumb-item active">Usuarios</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">

				<div class="d-flex justify-content-between align-items-center mb-4">
					<h5 class="card-title m-0">Listado de Usuarios</h5>
					<form method="get" th:action="@{/usuario/altaUsuario}">
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-person-plus-fill me-1"></i> Agregar Usuario
						</button>
					</form>
				</div>

				<div class="table-responsive">
					<table class="table table-hover" id="usuariosTable">
						<thead>
							<tr>
								<th>Nombre Usuario</th>
								<th>Estatus Usuario</th>
								<th>Estatus Sesión</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="usuario : ${usuarios}">
								<td th:text="${usuario.vc_nombre_usuario}"></td>
								<td>
									<span th:if="${usuario.i_estatus_usuario == 1}"
										class="badge bg-success">Activo</span>
									<span th:if="${usuario.i_estatus_usuario == 0}"
										class="badge bg-danger">Inactivo</span>
								</td>
								<td>
									<span th:if="${usuario.i_estatus_sesion == 1}"
										class="badge bg-success">Activo</span>
									<span th:if="${usuario.i_estatus_sesion == 0}"
										class="badge bg-secondary">Inactivo</span>
								</td>
								<td>
									<div class="d-flex gap-1">
										<button class="btn btn-sm btn-info text-white" data-bs-toggle="modal"
											title="Editar" data-bs-target="#basicModal"
											th:onclick="'showEditModal(' + ${usuario.pk_id_usuario} + ')'">
											<i class="bi bi-pencil-square"></i>
										</button>
										<button class="btn btn-sm btn-success" data-bs-toggle="modal"
											title="Cambiar contraseña" data-bs-target="#basicModalContrasenia"
											th:onclick="'modalCambioContra(' + ${usuario.pk_id_usuario} + ')'">
											<i class="bi bi-key-fill"></i>
										</button>
										<button class="btn btn-sm btn-danger" data-bs-toggle="tooltip"
											title="Baja Usuario"
											th:onclick="'bajaUsuario(' + ${usuario.pk_id_usuario} + ')'">
											<i class="bi bi-trash-fill"></i>
										</button>
										<button class="btn btn-sm btn-warning text-white" data-bs-toggle="tooltip"
											title="Reactivar Usuario"
											th:onclick="'reactivarUsuario(' + ${usuario.pk_id_usuario} + ')'">
											<i class="bi bi-unlock-fill"></i>
										</button>
										<button class="btn btn-sm btn-secondary" data-bs-toggle="tooltip"
											title="Desbloquear Usuario"
											th:onclick="'reactivarEstatusUsuario(' + ${usuario.pk_id_usuario} + ')'">
											<i class="bi bi-person-check-fill"></i>
										</button>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<!-- Basic Modal -->
		<div class="modal fade" id="basicModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Editar Usuario</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="edit-form" th:method="post" th:object="${usuario}">
							<div class="col-12">
								<label for="idUsuario" class="form-label">Id usuario</label>
								<input type="text" class="form-control" id="idUsuario" th:field="*{pk_id_usuario}"
									readonly>

								<label for="nombre" class="form-label mt-2">Nombre de usuario</label>
								<input type="text" class="form-control" id="nombre" th:field="*{vc_nombre_usuario}">

								<label for="rol" class="form-label mt-2">Rol</label>
								<select class="form-select" id="rol" th:field="*{rol_idRol.pk_id_rol}">
									<option th:each="rol : ${roles}" th:value="${rol.pk_id_rol}"
										th:text="${rol.vc_nombre_rol}"></option>
								</select>
							</div>
							<div class="modal-footer mt-3">
								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
								<button type="button" onclick="editarUsuario()" class="btn btn-primary">Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<!-- End Basic Modal-->

		<!-- Modal cambio de contraseña -->
		<div class="modal fade" id="basicModalContrasenia" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Cambiar contraseña</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="editPass-form" th:method="post" th:object="${historico}">
							<div class="col-12">
								<label for="idUsuario1" class="form-label">Id usuario</label>
								<input type="text" class="form-control" id="idUsuario1"
									th:field="*{usr_historico_contrasena_id.pk_id_usuario}" readonly>

								<label for="nombre1" class="form-label mt-2">Nombre de usuario</label>
								<input type="text" class="form-control" id="nombre1"
									th:field="*{usr_historico_contrasena_id.vc_nombre_usuario}" readonly>

								<label for="password" class="form-label mt-2">Contraseña nueva</label>
								<input type="password" class="form-control" id="password">
							</div>
							<div class="modal-footer mt-3">
								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
								<button type="button" onclick="cambiarContrasenia()"
									class="btn btn-primary">Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script th:src="@{/js/usuario/usuarios.js}"></script>
		<script th:src="@{/js/jquery.min.js}"></script>
		<script th:src="@{/js/datatables.min.js}"></script>
		<script th:src="@{/js/usuario/dataTableUsuarios.js}"></script>
	</th:block>
</body>

</html>
