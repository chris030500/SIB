<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-3"></div>
					<div class="col-md-9">
						<div class="card-body">
							<h2>Agregar Usuario</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12">
					<div class="card mb-12">
						<div class="card-header"></div>
						<br>
						<div class="card-body">
							<form class="row g-3">
								<div class="col-12">
									<label for="busquedaEmpleado" class="form-label">Buscar nombre de
										usuario</label>
									<input type="search" class="form-control" id="busquedaEmpleado"
										name="busquedaEmpleado" placeholder="Nombre de empleado"
										onkeyup="buscarEmpleado(this.value);" required>

								</div>
								<div class="col-sm-12">
									<label for="selectEmpleado" class="form-label">Elige un
										empleado</label>

									<select class="form-select" multiple aria-label="multiple select example"
										id="selectEmpleado" name="selectEmpleado">
									</select>
								</div>

								<div class="col-lg-12" id='datosUsuario' style='display:none'>
									<div class="row">
										<div class="col-sm-2">
											<label for="EmpleadoId" class="form-label">ID empleado</label>
											<input id="EmpleadoId" class="form-control" type="text"
												placeholder="EmpleadoId" />
										</div>
										<div class="col-sm-6">
											<label for="Nombre" class="form-label">Nombre empleado:</label>
											<input id="Nombre" class="form-control" type="text" placeholder="Nombre" readonly/>
										</div>
										<div class="col-sm-4">
											<label for="Puesto" class="form-label">Puesto:</label>
											<input id="Puesto" class="form-control" type="text" placeholder="Puesto" readonly/>
										</div>
									</div>
								</div>
								<div class="col-lg-12">
									<div class="row">
										<div class="col-6">
											<label for="nombreUsuario" class="form-label">Nombre de
												usuario:</label>
											<input type="text" class="form-control" id="nombreUsuario" required>
										</div>

										<div class="col-6">
											<label for="contrasena" class="form-label">Contraseña:</label>
											<input type="password" class="form-control" id="contrasena" readonly>
										</div>
									</div>
								</div>

							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script th:src="@{/js/usuario/usuarios.js}"></script>
	</th:block>
</body>

</html>
