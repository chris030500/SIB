<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Catálogo de Contratos</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Contratos</li>
					<li class="breadcrumb-item active">Catálogo</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">

				<div class="d-flex justify-content-between align-items-center mb-4">
					<h5 class="card-title m-0">Listado de Contratos</h5>
					<button type="button" class="btn btn-primary" data-bs-toggle="modal"
						data-bs-target="#modal-agregar">
						<i class="bi bi-plus-lg me-1"></i> Nuevo Contrato
					</button>
				</div>

				<div class="form-check mb-3">
					<input id="checkLista" class="form-check-input" type="checkbox" onclick="todosLosContratos()">
					<label class="form-check-label" for="checkLista">Mostrar todos los contratos (incluyendo
						inactivos)</label>
				</div>

				<div class="table-responsive">
					<table class="table table-hover" id="catalogo">
						<thead>
							<tr>
								<th scope="col">#</th>
								<th scope="col">Contrato</th>
								<th scope="col">Descripción</th>
								<th scope="col">Estatus</th>
								<th scope="col">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<!-- Llenado por JS -->
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<!-- Modal Agregar -->
		<div class="modal fade" id="modal-agregar" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Nuevo Contrato</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="formulario">
							<div class="mb-3">
								<label for="contrato" class="form-label">Nombre contrato</label>
								<input type="text" class="form-control" id="contrato" maxlength="55"
									placeholder="Nombre" required>
								<div class="form-text text-end" id="contador1">55 caracteres restantes</div>
							</div>
							<div class="mb-3">
								<label for="descripcion" class="form-label">Descripción</label>
								<textarea class="form-control" rows="3" id="descripcion" maxlength="200"
									placeholder="Descripción del contrato"></textarea>
								<div class="form-text text-end" id="contador2">200 caracteres restantes</div>
							</div>
							<div class="mb-3">
								<label class="form-label">Estatus</label>
								<div class="form-check">
									<input class="form-check-input" id="activo" type="radio" name="estatus" value="1">
									<label class="form-check-label" for="activo">Activo</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" id="inactivo" type="radio" name="estatus" value="0"
										checked>
									<label class="form-check-label" for="inactivo">Inactivo</label>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
						<button type="button" onclick="validarContrato()" class="btn btn-primary">Guardar</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Modal Editar -->
		<div class="modal fade" id="modal-editar" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Editar Contrato</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
							onclick="cerrarModal()"></button>
					</div>
					<div class="modal-body">
						<form id="formulario-editar">
							<div class="mb-3">
								<label for="idContrato" class="form-label">Nombre contrato</label>
								<input type="text" class="form-control" id="idContrato" maxlength="55"
									placeholder="Nombre" required>
								<div class="form-text text-end" id="contador3">55 caracteres restantes</div>
							</div>
							<div class="mb-3">
								<label for="idDescripcion" class="form-label">Descripción</label>
								<textarea class="form-control" rows="3" id="idDescripcion" maxlength="200"
									placeholder="Descripción del contrato"></textarea>
								<div class="form-text text-end" id="contador4">200 caracteres restantes</div>
							</div>

							<div class="alert alert-success d-none mb-3" id="idEstatusActivo">
								El contrato se encuentra <strong>activo.</strong>
							</div>

							<div class="mb-3" id="idActualizarEstatus">
								<label class="form-label">Estatus</label>
								<div class="form-check">
									<input class="form-check-input" id="idActivo" type="radio" name="idEstatus"
										value="1">
									<label class="form-check-label" for="idActivo">Activo</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" id="idInactivo" type="radio" name="idEstatus"
										value="0" checked>
									<label class="form-check-label" for="idInactivo">Inactivo</label>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
						<button type="button" class="btn btn-primary" onclick="formularioEditar(estado)">Guardar
							Cambios</button>
					</div>
				</div>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/catalogo_contratos/documento.js}"></script>
		<!-- Eliminado CSS responsivo legacy -->
	</th:block>
</body>

</html>
