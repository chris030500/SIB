<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Generar Reporte</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Reportes</li>
					<li class="breadcrumb-item active">Folios CSO</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Criterios de Búsqueda</h5>

				<div id="divGenerarReporte">

					<!-- Opción Todos -->
					<div class="form-check mb-4">
						<input class="form-check-input" type="checkbox" id="ckTodos" onchange="opcionTodos()">
						<label class="form-check-label fw-bold" for="ckTodos">
							Todos los registros
						</label>
					</div>

					<!-- Fechas -->
					<div class="row g-3 mb-4">
						<div class="col-md-6">
							<label class="form-label">Fecha Inicio</label>
							<input class="form-control" type="date" id="dtFechaInicio">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha Fin</label>
							<input class="form-control" type="date" id="dtFechaFin">
						</div>
					</div>

					<!-- Parámetros Específicos -->
					<div id="divParamBusqueda" class="mb-4">
						<h6 class="fw-bold mb-3">Filtros Adicionales</h6>
						<div class="row g-3">
							<div class="col-md-3">
								<label class="form-label">Nro. Oficio</label>
								<select class="form-select" id="nrOficio">
									<option value="0">Seleccione...</option>
									<option th:each="opcion : ${cat_lista_oficios}" th:value="${opcion.pk_id_folio}"
										th:text="${opcion.i_folio}"></option>
								</select>
							</div>
							<div class="col-md-3">
								<label class="form-label">Tipo Oficio</label>
								<select class="form-select" id="iOficio">
									<option value="0">Seleccione...</option>
									<option th:each="opcion : ${cat_tipo_oficio}" th:value="${opcion.i_opcion}"
										th:text="${opcion.v_valor}"></option>
								</select>
							</div>
							<div class="col-md-3">
								<label class="form-label">Órgano Emisor</label>
								<select class="form-select" id="iEmite">
									<option value="0">Seleccione...</option>
									<option th:each="opcion : ${cat_lista_reguladores}" th:value="${opcion.i_opcion}"
										th:text="${opcion.v_valor}"></option>
								</select>
							</div>
							<div class="col-md-3">
								<label class="form-label">Estatus</label>
								<select class="form-select" id="iEstatus">
									<option value="0">Seleccione...</option>
									<option th:each="opcion : ${cat_lista_estatus}" th:value="${opcion.i_opcion}"
										th:text="${opcion.v_valor}"></option>
								</select>
							</div>
						</div>
					</div>

					<div class="text-end">
						<button type="button" class="btn btn-primary" id="btnGenerarReporte">
							<i class="bi bi-file-earmark-text me-1"></i> Generar Reporte
						</button>
					</div>

				</div>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/sweetalert2.all.min.js}"></script>
		<script th:src="@{/js/reporteFolio/reporteFolio.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
