<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Reportes Operativos</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Operaciones</li>
					<li class="breadcrumb-item active">Reportes</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Generar Reporte</h5>

				<form name="formReporte" id="formReporte" class="row g-3">
					<input type="hidden" id="idSucursalInicial" th:value="${sucursalInicial}" />

					<div class="col-md-4">
						<label class="form-label">Tipo de búsqueda</label>
						<select id="selectBusqueda" class="form-select">
							<option value="" disabled selected>Seleccione...</option>
							<option th:each="busqueda : ${listaBusqueda}" th:value="${busqueda.i_opcion}"
								th:text="${busqueda.v_valor}">
							</option>
						</select>
					</div>

					<div class="col-md-12">
						<div class="row g-3" id="filtrosDinamicos" style="display:none;">

							<div class="col-md-4" id="verSucursal">
								<label class="form-label">Sucursal</label>
								<input type="search" class="form-control" id="buscarSucursal" list="opcionSucursal"
									autocomplete="off" placeholder="Buscar sucursal...">
								<datalist id="opcionSucursal">
									<option th:each="sucursal : ${sucursales}" th:value="${sucursal.vc_nombre_sucursal}"
										th:text="${sucursal.vc_nombre_sucursal}" th:id="${sucursal.i_sucursal}"
										th:data-value="${sucursal.i_sucursal}"></option>
								</datalist>
								<div id="group-sucursal" class="list-group mt-1"></div>
							</div>

							<div class="col-md-4" id="verCliente" style="display: none;">
								<label class="form-label">Cliente</label>
								<div class="input-group">
									<input type="search" class="form-control" id="buscarCliente" list="opcionCliente"
										autocomplete="off" placeholder="Buscar cliente..." disabled>
									<span class="input-group-text" id="spinnerClientes" style="display:none;">
										<div class="spinner-border spinner-border-sm text-primary" role="status"></div>
									</span>
								</div>
								<datalist id="opcionCliente"></datalist>
								<div id="group-general" class="list-group mt-1"></div>
							</div>

							<div class="col-md-4">
								<label class="form-label">Estatus de gestión</label>
								<select id="selectGestion" class="form-select">
									<option value="0" disabled selected>Seleccione...</option>
									<option th:each="estatus : ${listaEstatus}" th:value="${estatus.i_opcion}"
										th:text="${estatus.v_valor}">
									</option>
								</select>
								<div id="group-estatus" class="list-group mt-1"></div>
							</div>

							<div class="col-md-4">
								<label class="form-label">Fecha inicio</label>
								<input class="form-control" type="date" id="fechaInicio">
							</div>

							<div class="col-md-4">
								<label class="form-label">Fecha fin</label>
								<input class="form-control" type="date" id="fechaFin">
								<div class="invalid-feedback d-block" id="errorFecha"></div>
							</div>

							<div class="col-md-4 d-flex align-items-end">
								<button class="btn btn-success w-100" title="Generar Reporte" onclick="obtenerDatos()"
									type="button">
									<i class="bi bi-file-earmark-spreadsheet me-1"></i> Generar Excel
								</button>
							</div>

						</div>
					</div>
				</form>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/operaciones/reportes.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
