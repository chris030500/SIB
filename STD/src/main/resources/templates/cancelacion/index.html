<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>

	<section class="content" layout:fragment="page-content">
		<div class="container" style="display: block;" id="principalID">
			<div class="row">
				<!-- Columna principal -->
				<div class="col-md-12">
					<!-- Card principal -->
					<div class="card card-primary">
						<div class="card-header">
							<h2 style="color: black; text-align: center;">Cancelar Videograbación</h2>
						</div>
						<div class="card-body" style="padding-top: 20px;">
							<!-- Buscador de solicitud -->
							<div class="row">
								<div class="col-sm-12">
									<form class="formulario" id="formSolicitudCredito">
										<div class="row">
											<div class="col-sm-12">
												<label for="inputEmail5" class="form-label">Solicitud de crédito</label>
												<code>(*)</code>
											</div>
										</div>
										<div class="row">
											<div class="col-sm-4">
												<input type="text" placeholder="núm de solicitud" class="form-control"
													id="buscarCredito">
											</div>
											<div class="col-sm-4">
												<button type="button"
													onclick="buscarSolicitudCredito(buscarCredito.value)"
													class="btn btn-primary">Buscar</button>
											</div>
										</div>
									</form>
								</div>
							</div>

							<!-- Mostrar alerta si no hay solicitudes disponibles -->
							<div class="row" id="diponibleID" style="display: none; padding-top: 20px;">
								<div class="col-sm-12">
									<div class="alert alert-primary">
										<strong>No hay solicitudes</strong> disponibles para cancelar.
									</div>
								</div>
							</div>

							<!-- Info de la solicitud -->
							<div class="row" id='datoSolicitud' style='display:none; padding-top: 20px;'>
								<div class="col-sm-12">
									<div class="row">
										<div class="col-sm-4">
											<div class="form-group">
												<label for="solicitud" class="form-label">Solicitud</label>
												<input type="text" class="form-control" id="solicitud" readonly>
											</div>
										</div>
										<div class="col-sm-4" id="divIdProducto">
											<div class="form-group">
												<label for="producto" class="form-label">IDProducto</label>
												<input type="text" class="form-control" id="producto" readonly>
											</div>
										</div>
										<div class="col-sm-4">
											<div class="form-group">
												<label for="producto" class="form-label">Producto</label>
												<input type="text" class="form-control" id="Nombreproducto" readonly>
											</div>
										</div>
									</div>
									<div class="row" style="padding-top: 20px;">
										<div class="col-sm-4">
											<div class="form-group">
												<label for="montoSolicitado" class="form-label">Monto Solicitado</label>
												<input type="text" class="form-control" id="montoSolicitado" readonly>
											</div>
										</div>
										<div class="col-sm-4">
											<div class="form-group">
												<label for="montoAutorizado" class="form-label">Monto Autorizado</label>
												<input type="text" class="form-control" id="montoAutorizado" readonly>
											</div>
										</div>
										<div class="col-sm-4">
											<div class="form-group">
												<label for="plazo" class="form-label">Plazo</label>
												<input type="text" class="form-control" id="plazo" readonly>
											</div>
										</div>
									</div>
									<div class="row" style="padding-top: 20px;">
										<div class="col-sm-4">
											<div class="form-group">
												<label for="tasaNormal" class="form-label">Tasa Normal</label>
												<input type="text" class="form-control" id="tasaNormal" readonly>
											</div>
										</div>
										<div class="col-sm-4">
											<div class="form-group">
												<label for="estatus" class="form-label">Estatus</label>
												<input type="text" class="form-control" id="estatus" readonly>
											</div>
										</div>
									</div>
								</div>
							</div>

							<!-- Info de los participantes -->
							<div class="row" id="divParticipantes" style='display:none; padding-top: 20px;'>
								<div class="col-sm-12">
									<h5 class="card-title" style="color: black;"><strong>Participantes</strong></h5>
									<div class="card-body table-responsive p-0">
										<table class="table table-hover text-nowrap" id="participantes">
											<thead class="table-secondary">
												<tr>
													<th scope="col">Nombre</th>
													<th scope="col">Rol</th>
													<th scope="col">Tel. Celular</th>
													<th scope="col">Correo</th>
												</tr>
											</thead>
											<tbody>
											</tbody>
										</table>
									</div>
								</div>
							</div>

							<!-- Solicitudes canceladas -->
							<div class="row" id="canceladasID" style='display:none; padding-top: 20px;'>
								<div class="col-sm-12">
									<h5 class="card-title" style="color: black;"><strong>Solicitudes canceladas</strong>
									</h5>
									<div class="card-body table-responsive p-0">
										<table class="table table-hover text-nowrap" style="text-align: center;"
											id="solicitudesCanceladasID">
											<thead class="table-secondary">
												<tr>
													<th scope="col">No. Solicitud envio</th>
													<th scope="col">Fecha cancelación</th>
													<th scope="col">Observaciones</th>
													<th scope="col">Tipo de cancelación</th>
												</tr>
											</thead>
											<tbody>
											</tbody>
										</table>
									</div>
								</div>
							</div>

							<!-- Info datos de envio -->
							<div class="row" id="mostrarSolicitudId" style="display:none; padding-top: 20px;">
								<div class="col-sm-12">
									<h5 class="card-title" style="color: black;"><strong>Datos de envio</strong></h5>
									<div class="row">
										<div class="col-sm-4">
											<label for="seId" class="form-label">No. Solicitud de envio</label>
											<input name="seId" type="text" class="form-control" id="seId"
												readonly>
										</div>
										<div class="col-sm-4">
											<label for="fechaAutorizacion" class="form-label">Fecha de
												Autorización</label>
											<input name="fechaAutorizacion" type="date" class="form-control"
												id="fechaAutorizacion" readonly>
										</div>
										<div class="col-sm-4">
											<label for="quienAutorizo" class="form-label">Quién autorizó</label>
											<input name="quienAutorizo" type="text" class="form-control"
												id="quienAutorizo" readonly>
										</div>
									</div>
									<div class="row" style="padding-top: 20px;">
										<div class="col-sm-4">
											<label for="fechaRegistro" class="form-label">Fecha de Registro </label>
											<input name="fechaRegistro" type="date" class="form-control"
												id="fechaRegistro" readonly>
										</div>
										<div class="col-sm-4">
											<label for="fechaCancelacion" class="form-label">Fecha de Cancelación
											</label>
											<input name="fechaCancelacion" type="date" class="form-control"
												id="fechaCancelacion" readonly>
										</div>
										<div class="col-sm-4">
											<label for="horaCancelacion" class="form-label">Hora de
												Cancelación</label>
											<input type="time" class="form-control" id="horaCancelacion" readonly>
										</div>
									</div>
								</div>
							</div>

							<!-- Botón de cancelar -->
							<div class="row" id='botonCancelarId' style='display:none; padding-top: 20px;'>
								<div class="col-sm-12" style="text-align: right;">
									<button type="button" class="btn btn-danger"
										onclick="alertaEliminarSolicitud()">Cancelar</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="container" style="display: none;" id="spinnerID">
			<div class="row">
				<div class="col-md-12">
					<div class="card card-primary">
						<div class="card-header">
							<h2 style="color: black; text-align: center;">Cancelar Videograbación</h2>
						</div>
						<div class="card-body" style="padding-top: 20px; height: 300px;">
							<div class="row" style="height: 90px;"></div>
							<div class="row" style="text-align: center;">
								<div class="col-sm-12">
									<div class="spinner-border text-primary"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<th:block layout:fragment="page-scripts">
		<script th:src="@{/js/jquery-3.5.1.js}"></script>
		<script th:src="@{/vendor/sweetalertNew/sweetalert2.all.min.js}"></script>
		<script th:src="@{/vendor/bootstrap/bootstrap2.min.js}"></script>
		<script th:src="@{/vendor/bootstrapTable/bootstrap-table2.min.js}"></script>
		
	<!--	<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script> -->
		<!--JavaScript-->
		<script th:src="@{/js/cancelacion/index.js}"></script>
		<script type="text/css" th:src="@{/css/estilos/responsivo.css}"></script>
	</th:block>
</body>

</html>
