<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Cobro Domiciliado</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Cobranza</li>
					<li class="breadcrumb-item active">Domiciliación</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card" id="principalId">
			<div class="card-body">
				<h5 class="card-title">Gestión de Cobro Domiciliado</h5>

				<div class="row g-3 mb-4">
					<div class="col-md-4">
						<label for="catalogoId" class="form-label fw-bold">Catálogo de bancos</label>
						<select id="catalogoId" class="form-select">
							<option value="" disabled selected>Seleccione un banco...</option>
						</select>
					</div>
				</div>

				<div id="cargaId" style="display: none;" class="mb-4 p-3 border rounded bg-light">
					<h6 class="fw-bold mb-3">Cargar Archivo</h6>
					<div class="row g-3 align-items-end">
						<div class="col-md-6">
							<label for="idArchivo" class="form-label">Seleccionar archivo (.txt)</label>
							<input type="file" class="form-control" id="idArchivo" accept=".txt">
						</div>
						<div class="col-md-6" id="idBotonGenerar" style="display: none;">
							<button class="btn btn-primary" id="nuevoLayout">
								<i class="bi bi-file-earmark-arrow-up me-1"></i> Generar archivo
							</button>
						</div>
					</div>
				</div>

				<h5 class="card-title mt-4">Historial de Procesos</h5>
				<div class="table-responsive">
					<table class="table table-hover" id="bitacoraId">
						<thead>
							<tr>
								<th class="text-center">N°</th>
								<th class="text-center">Banco</th>
								<th class="text-center">Registros</th>
								<th class="text-center">Monto Total</th>
								<th class="text-center">Fecha</th>
								<th class="text-center">Usuario</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
				<div class="d-flex justify-content-end mt-3" id="paginadoId"></div>

			</div>
		</div>

		<!-- Spinner Overlay (Reemplaza al contenedor separado) -->
		<div id="spinnerId"
			class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center"
			style="background: rgba(255,255,255,0.8); z-index: 9999;">
			<div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
				<span class="visually-hidden">Cargando...</span>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
		<script th:src="@{/js/cobranza/domiciliado.js}"></script>
		<!-- Eliminados scripts duplicados de jQuery y Bootstrap -->
	</th:block>
</body>

</html>
