<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Referencia de Pagos</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Cobranza</li>
					<li class="breadcrumb-item active">Referencia de Pagos</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card" id="paginaId">
			<div class="card-body">
				<h5 class="card-title">Búsqueda de Referencias</h5>

				<!-- Buscador -->
				<form id="formBuscarID" class="row g-3 mb-4">
					<div class="col-md-4">
						<label for="opcionesId" class="form-label">Tipo de Búsqueda <span
								class="text-danger">*</span></label>
						<select class="form-select" id="opcionesId">
							<option value="" disabled selected>Buscar por...</option>
						</select>
					</div>
					<div class="col-md-6">
						<label for="buscadorId" class="form-label">Dato de Búsqueda <span
								class="text-danger">*</span></label>
						<div class="input-group">
							<input type="text" placeholder="Ingrese dato..." class="form-control" id="buscadorId">
							<button type="button" onclick="validarInformacion(buscadorId.value)"
								class="btn btn-primary">
								<i class="bi bi-search"></i> Buscar
							</button>
						</div>
					</div>
				</form>

				<!-- Datos del cliente -->
				<div id="mostrarDatosId" style="display: none;" class="mb-4 p-3 border rounded bg-light">
					<h6 class="fw-bold mb-3">Datos del Cliente</h6>
					<div class="row g-3">
						<div class="col-md-4">
							<label for="numClienteId" class="form-label">Núm Cliente</label>
							<input type="text" class="form-control" id="numClienteId" disabled>
						</div>
						<div class="col-md-8">
							<label for="nomClienteId" class="form-label">Nombre Cliente</label>
							<input type="text" class="form-control" id="nomClienteId" disabled>
						</div>
					</div>
				</div>

				<!-- Cuenta Principal -->
				<div id="mostrarCtaPrincipalId" style="display: none;" class="mb-4">
					<div class="d-flex justify-content-between align-items-center mb-2">
						<h6 class="fw-bold m-0">Cuenta Principal</h6>
						<div id="exportar" style="display: none;">
							<button type="button" onclick="exportarBusqueda()" class="btn btn-sm btn-danger">
								<i class="bi bi-file-earmark-pdf"></i> Exportar
							</button>
						</div>
					</div>
					<div class="table-responsive">
						<table class="table table-hover table-bordered" id="ctaPrincipalId">
							<thead class="table-primary">
								<tr>
									<th>Núm Cuenta Principal</th>
									<th>Referencia 1</th>
									<th>Referencia 2</th>
									<th>Banco</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>

				<!-- Crédito -->
				<div id="mostrarCreditoId" style="display: none;" class="mb-4">
					<h6 class="fw-bold mb-2">Créditos</h6>
					<div class="table-responsive">
						<table class="table table-hover table-bordered" id="creditoId">
							<thead class="table-primary">
								<tr>
									<th>Núm Crédito</th>
									<th>Nombre Producto</th>
									<th>Referencia</th>
									<th>Banco</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>

				<!-- Historial / Reporte -->
				<div id="reporte" style="display: none;" class="mt-4 pt-3 border-top">
					<h5 class="card-title">Reporte de Búsquedas</h5>
					<div class="row g-3 align-items-end">
						<div class="col-md-4">
							<label for="dtFechaInicio" class="form-label">Fecha Inicio</label>
							<input class="form-control" type="date" id="dtFechaInicio">
						</div>
						<div class="col-md-4">
							<label for="dtFechaFin" class="form-label">Fecha Fin</label>
							<input class="form-control" type="date" id="dtFechaFin">
						</div>
						<div class="col-md-4">
							<button class="btn btn-success w-100" title="Generar Reporte" type="button"
								onclick="validarFechas()">
								<i class="bi bi-file-earmark-excel me-1"></i> Generar Reporte
							</button>
						</div>
					</div>
				</div>

			</div>
		</div>

		<!-- Spinner Overlay -->
		<div id="spinnerId"
			class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center"
			style="background: rgba(255,255,255,0.8); z-index: 9999;">
			<div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
				<span class="visually-hidden">Cargando...</span>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/cobranza/referencia.js}"></script>
		<!-- Eliminados scripts duplicados -->
	</th:block>
</body>

</html>
