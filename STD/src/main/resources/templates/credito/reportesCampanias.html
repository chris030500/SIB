<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">
<!-- DES-25-0014 Campinias -->
<!-- viviana.zamudio -->

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="border p-2 card">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Reportes Campañas</h2>
						</div>
					</div>
				</div>
			</div>
			<!-- FORMULARIO 2: Parámetros -->
			<form id="formReportes">
				<div id="divBusqueda">
					<fieldset class="border p-2">
						<legend class="float-none w-auto p-2">Parámetros de Reportes</legend>
						
						<!-- Reportes -->
						<div class="row" style="margin-top: 15px;">
							<div class="col-md-4">
								<label class="col-form-label">Reporte:</label>
							</div>
							<div class="col-md-4">
								<select class="form-control" name="reporte" id="idReporte"
									onchange="asignarArchivo(this)">
									<option value="0">Seleccione</option>
									<option th:each="opcionTipo : ${cat_reportes}"
										th:value="${opcionTipo.i_opcion}" th:text="${opcionTipo.v_valor}"
										th:id="${opcionTipo.v_pantalla}">
									</option>
								</select>
							</div>
						</div>
						
						<!-- Campanias -->
						<div class="row" id="divCampania" style="margin-top: 15px;">
							<div class="col-md-4">
								<label class="col-form-label">Campañas:</label>
							</div>
							<div class="col-md-4">
								<!--select class="form-control" name="campania" id="idCampania"
									onchange="asignarArchivo(this)">
									<option value="0">Seleccione</option>
									<option th:each="opcionTipo : ${cat_campanias}"
										th:value="${opcionTipo.pk_id_tipo_campania}"
										th:text="${opcionTipo.vc_tipo_campania}">
									</option>
								</select-->
								<select id="Campania" name="campania" multiple class="form-control" size="5" style="height: 100%;">
				                    <!-- Las opciones se llenan por JavaScript -->
				                </select>
							</div>
						</div>
								<!-- Fechas Inicio-->
							<div class="row" style="margin-top: 15px;">
							
								<div class="col-md-4"><label class="col-form-label">Fecha de Inicio:</label></div>
								<div class="col-md-4"><input type="date" class="form-control" id="FechaInicio"
										name="FechaInicio" /></div>
							
							</div>
							
						<!-- Fechas Fin-->
							<div class="row" style="margin-top: 15px;">
								<div class="col-md-4"><label class="col-form-label">Fecha de Fin:</label></div>
								<div class="col-md-4"><input type="date" class="form-control" id="FechaFin"
										name="FechaFin" /></div>
							</div>
							
							<!-- Estatus -->
							<!--div class="row" id="divEstatus" style="margin-top: 15px;">
								<div class="col-md-4">
									<label class="col-form-label">Estatus:</label>
								</div>
								<div class="col-md-4">
									<select class="form-control" name="estatusCampania" id="estatusCampania">
										<option value="0">Seleccione</option>
										<option th:each="opcionTipo : ${cat_estatus}"
											th:value="${opcionTipo.i_opcion}" th:text="${opcionTipo.v_valor}">
										</option>
									</select>
								</div>
							</div-->

					
						<!-- Botón Guardar -->
						<div class="row mt-4">
							<div class="col-md-4"></div>
							<div class="col-md-4"></div>
							<div class="col-md-4 text-left">
								<button type="submit" class="btn btn-primary" id="btnGuardarParamBC"
								onclick="generarReporte()">Generar Reporte</button>
							</div>
						</div>
					</fieldset>
				</div>
			</form>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/jquery-3.5.1.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/credito/reportesCampanias.js}"></script>
	</th:block>
</body>

</html>
