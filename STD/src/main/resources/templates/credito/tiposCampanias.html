<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">
<!-- DES-25-0014 Campinias -->
<!-- viviana.zamudio -->

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container border p-2">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Tipos Campañas</h2>
						</div>
					</div>
				</div>
			</div>
			<div id="divGenerarReporte" class="container">
				<div class="row">
					<div class="col-md-6">
						<label class="col-form-label">Campaña de Crédito</label>
						<input type="search" class="form-control" id="buscarCampania"
						       list="opcionCampania" autocomplete="off"
						       placeholder="Buscar campaña"
						       oninput="buscarCampanias()" />
						<datalist id="opcionCampania"></datalist>
					</div>
				</div>
				<div class="m-3">
					<div class="col-md-12">
						<div id="detalleCampania" style="display: none;">
							<div class="col-md-3">
							    <label class="col-form-label">Tipo de Campaña</label>
							    <select class="form-control" id="tipoCampanias">
									
								</select>
						    </div>
						    <fieldset class="border p-2">
							<legend class="float-none w-auto p-2">Condiciones Generales</legend>
							<div id="divTodos" class="container">
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-3">
										<label for="Ventana" class="form-label">Ventana (años):</label>
										<input id="Ventana" name="ventana" required class="form-control" type="text"
										       placeholder="Ventana (años)"
										        />
									</div>
									<div class="col-md-3">
										<label for="EdadMaxima" class="form-label">Edad Máxima:</label>
										<input id="EdadMaxima" name="edadMaxima" required class="form-control" type="text"
										       placeholder="Edad Máxima"
										        />
									</div>
									<div class="col-md-3">
										<label for="EdadMinima" class="form-label">Edad Minima:</label>
										<input id="EdadMinima" name="edadMinima" required class="form-control" type="text"
										       placeholder="Edad Minima"
										        />
									</div>
									<div class="col-md-3">
										<label for="MontoMinimo" class="form-label">Monto Minimo:</label>
										<input id="MontoMinimo" name="montoMinimo" required class="form-control" type="text"
										       placeholder="Monto Minimo" 
										        />
									</div>
									<div class="col-md-3">
										<label for="MontoMaximo" class="form-label">Monto Máximo:</label>
										<input id="MontoMaximo" name="montoMaximo" required class="form-control" type="text"
										       placeholder="Monto Máximo" 
										        />
									</div>
									<div class="col-md-3">
										<label for="MoraMaxima" class="form-label">Mora Máxima:</label>
										<input id="MoraMaxima" name="moraMaxima" required class="form-control" type="text"
										       placeholder="Mora Máxima" 
										        />
									</div>
									<div class="col-md-3">
										<label for="PorceCubiertoCap" class="form-label">Porcentaje Cubierto Capital:</label>
										<input id="PorceCubiertoCap" name="porceCubiertoCap" required class="form-control" type="text"
										       placeholder="Porcentaje Cubierto Capital" 
										        />
									</div>
									<div class="col-md-3">
										<label for="DiasGracia" class="form-label">Días Gracia:</label>
										<input id="DiasGracia" name="diasGracia" required class="form-control" type="text"
										       placeholder="Días Gracia" 
										        />
									</div>
									<div class="col-md-3">
										<label for="DiasMora" class="form-label">Días Mora:</label>
										<input id="DiasMora" name="diasMora" required class="form-control" type="text"
										       placeholder="Días Mora" 
										        />
									</div>
									<div class="col-md-3">
										<label for="PlazoMaximoAnios" class="form-label">Plazo Máximo Años:</label>
										<input id="PlazoMaximoAnios" name="plazoMaximoAnios" required class="form-control" type="text"
										       placeholder="Plazo Máximo Años" 
										        />
									</div>
									<div class="col-md-3">
										<label for="MinimoVida" class="form-label">Minimo Vida del Crédito (meses):</label>
										<input id="MinimoVida" name="minimoVida" required class="form-control" type="text"
										       placeholder="Monto Minimo" 
										        />
									</div>
									<div class="col-md-3">
										<label for="VigenciaBC" class="form-label">Vigencia BC:</label>
										<input id="VigenciaBC" name="vigenciaBC" required class="form-control" type="text"
										       placeholder="Vigencia BC" 
										        />
									</div>
									<div class="col-md-3">
										<label for="VigenciaCampania" class="form-label">Vigencia Campaña:</label>
										<input id="VigenciaCampania" name="vigenciaCampania" required class="form-control" type="text"
										       placeholder="Vigencia Campaña" 
										        />
									</div>
									<div class="col-md-3">
										<label for="CreditosLiquidados" class="form-label">Créditos Liquidados:</label>
										<input id="CreditosLiquidados" name="CreditosLiquidados" required class="form-control" type="text"
										       placeholder="Créditos Liquidados" 
										        />
									</div>
									<div class="col-md-3">
										<label for="EsRenovacion" class="form-label">Es Renovacion:</label>
										<div id="checksEsRenovacion"></div>
									</div>
									<div class="col-md-3">
										<label for="ConvivenciaCampanias" class="form-label">Convivencia entre Campañas:</label>
										<select class="form-control" id="convivenciaCamp">
								
										</select>
									</div>
									<div class="col-md-3">
										<label for="Productos" class="form-label">Productos:</label>
										<select id="Productos" name="productos" multiple required class="form-control" size="5">
										    <!-- Las opciones se llenan por JavaScript -->
										</select>
									</div>
								</div>
							</div>
						</fieldset>
						<fieldset class="border p-2">
							<legend class="float-none w-auto p-2">Condiciones Oferta</legend>
							<div id="divTodos" class="container">
								<div class="row" style="margin-top : 15px ">
									<div class="col-md-3">
										<label for="ProdCredito" class="form-label">Producto de Crédito:</label>
										<input id="ProdCredito" name="prodCredito" required class="form-control" type="text"
										       placeholder="Producto de Crédito"
										        />
									</div>
									<div class="col-md-3">
										<label for="PorceIncremento" class="form-label">Porcentaje de Incremento:</label>
										<input id="PorceIncremento" name="porceIncremento" required class="form-control" type="text"
										       placeholder="Porcentaje de Incremento"
										        />
									</div>
									<div class="col-md-3">
										<label for="EsRenovacionOferta" class="form-label">Es Renovación:</label>
										<div id="checksEsRenovacionOferta"></div>
									</div>
									<div class="col-md-3">
										<label for="VigenciaCampaniaOferta" class="form-label">Vigencia Campaña:</label>
										<input id="VigenciaCampaniaOferta" required name="vigenciaCampaniaOferta" class="form-control" type="text"
										       placeholder="Vigencia Campaña" 
										        />
									</div>
									<div class="col-md-3">
										<label for="TasaOrdinaria" class="form-label">Tasa Ordinaria:</label>
										<input id="TasaOrdinaria" name="tasaOrdinaria" required class="form-control" type="text"
										       placeholder="Tasa Ordinaria" 
										        />
									</div>
									<div class="col-md-3">
										<label for="Activa" class="form-label">Activa:</label>
										<div id="checksActiva"></div>
									</div>
									<div class="col-md-3">
										<label for="MontoMaximoOferta" class="form-label">Monto Máximo:</label>
										<input id="MontoMaximoOferta" name="montoMaximoOferta" required class="form-control" type="text"
										       placeholder="Monto Máximo" 
										        />
									</div>
								</div>
							</div>
						</fieldset>
						<button type="button" class="btn btn-primary" onclick="modificarTiposCampanias()">
							Modificar
						</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/jquery-3.5.1.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/credito/tiposCampanias.js}"></script>
	</th:block>
</body>

</html>
