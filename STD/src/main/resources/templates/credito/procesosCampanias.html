<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">
<!-- DES-25-0014 Campinias -->
<!-- viviana.zamudio -->

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="border p-2 card">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Procesos Campañas</h2>
						</div>
					</div>
				</div>
			</div>
			<div id="divGenerarReporte" class="container">
				<div class="m-3">
					<div class="col-md-12">
						
							
						    <fieldset class="border p-3" style="width: 100%; min-height: 300px;">
							<legend class="float-none w-auto p-2">Busqueda</legend>
							<div id="divTodos" class="container">
								<div class="row">
									
									
						            <!-- Columna izquierda: Campaña ocupa 2 filas -->
						            <div class="col-md-6">
						                <label for="Campania" class="form-label">Campaña:</label>
						                <input type="hidden" class="form-control" id="idUser" th:value="${idUsuario}" readonly>
						                <select id="Campania" name="campania" multiple required class="form-control" size="5" style="height: 100%;">
						                    <!-- Las opciones se llenan por JavaScript -->
						                </select>
						            </div>
						
						            <!-- Columna derecha: dos filas dentro -->
						            <div class="col-md-6">
						                <div class="row">
						                    <div class="col-md-6">
						                        <label for="FechaInicio" class="form-label">Fecha Inicio:</label>
						                        <input id="FechaInicio" th:value="${idFecha}" name="fechaInicio" required class="form-control" type="date" />
						                    </div>
						                    <div class="col-md-6">
						                        <label for="FechaFin" class="form-label">Fecha Fin:</label>
						                        <input id="FechaFin" th:value="${idFecha}" name="fechaFin" required class="form-control" type="date" />
						                    </div>
						                </div>
						                <div class="row mt-3">
						                    <div class="col text-start">
						                        <button type="button" class="btn btn-primary" onclick="buscarProcesosCampanias()">Buscar</button>
						                    </div>
						                </div>
									</div>
									
								</div>
							</div>
							
						</fieldset>
						
						<fieldset class="border p-3" style="width: 100%; min-height: 300px;">
						<legend class="float-none w-auto p-2">Procesos Campaña</legend>
						
						<!--table class="table table-striped mt-4"-->
						<table class="table table-sm" style="width: 100%; text-align: center;"
									id="tblGestionSMS">
						    <thead>
						        <tr>
									<th>Seleccionar</th>
						            <th>Fecha Extracción</th>
						            <th>Usuario</th>
						            <th>Campaña</th>
						            <th>Fcha Inicio Vigencia</th>
						            <th>Fcha Fin Vigencia</th>
						            <th>Estatus</th>
						            <!-- otros campos -->
						        </tr>
						    </thead>
						    <tbody id="tablaProcesosBody">
								<!-- Se llenará con JS -->
							</tbody>
						</table>
						<div class="col text-start">
	                        <button type="button" class="btn btn-primary" onclick="generarReportProcesosCampanias()">Generar Reporte</button>
	                    </div>
						</fieldset>
						
					</div>
				</div>
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		<script th:src="@{/js/dataTables.bootstrap.min.js}"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@7"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/credito/dataTableConfigCredito.js}"></script>
		<script th:src="@{/js/credito/fillDataTableConfig.js}"></script>
		<script th:src="@{/js/credito/procesosCampanias.js}"></script>
		
		<!--script th:src="@{/js/jquery-3.5.1.js}"></script-->
		
	</th:block>
</body>

</html>
