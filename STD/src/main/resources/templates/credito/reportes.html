<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container border p-2">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Reporte Consumo SMS</h2>
						</div>
					</div>
				</div>
			</div>
			<div id="divGenerarReporte">
				<fieldset class="border p-2">
					<legend class="float-none w-auto p-2">Generar Reporte</legend>
					<div id="divTodos">
						<div class="row" style="margin-top : 15px ">
							<div class="col-md-4">
								<label class="col-form-label">Fecha Inicio:</label>
								<input class="form-control" type="date" id="dtFechaInicio" placeholder="Fecha desde">
							</div>
							<div class="col-md-4">
								<label class="col-form-label">Fecha Fin:</label>
								<input class="form-control" type="date" id="dtFechaFin" placeholder="Fecha hasta">
							</div>
							<div class="col-md-4">
								<label class="col-form-label">Cliente:</label>
								<input type="search" class="form-control" id="searchCustomer" list="customerOption"
									autocomplete="off" placeholder="Buscar cliente">
								<datalist id="customerOption"></datalist>
							</div>
							<div class="col-md-4">
								<label class="col-form-label">Celular:</label>
								<input type="search" class="form-control" id="searchCellphone" list="cellphoneOption"
									autocomplete="off" placeholder="Buscar celular">
								<datalist id="cellphoneOption"></datalist>
							</div>
						</div>
						<div class="row" style="margin-top : 15px; text-align: center;">
							<div class="col-md-8"></div>
							<div class="col-md-4">
								<button class="btn btn-primary" title="Generar Reporte" data-bs-target="#"
									aria-controls="table-datatable" type="button" data-tooltip="Add"
									onclick="generarReporte()">
									<i class="bi bi-filetype-exe"></i>
								</button>
							</div>
						</div>
					</div>
				</fieldset>
			
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/jquery-3.5.1.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/credito/reportes.js}"></script>
	</th:block>
</body>

</html>
