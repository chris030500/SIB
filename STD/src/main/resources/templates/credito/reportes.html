<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Reporte Consumo SMS</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Crédito</li>
					<li class="breadcrumb-item active">Reporte SMS</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Generar Reporte</h5>

				<form id="formReporte" class="row g-3">

					<div class="col-md-6">
						<label for="dtFechaInicio" class="form-label">Fecha Inicio</label>
						<input class="form-control" type="date" id="dtFechaInicio">
					</div>
					<div class="col-md-6">
						<label for="dtFechaFin" class="form-label">Fecha Fin</label>
						<input class="form-control" type="date" id="dtFechaFin">
					</div>

					<div class="col-md-6">
						<label for="searchCustomer" class="form-label">Cliente</label>
						<input type="search" class="form-control" id="searchCustomer" list="customerOption"
							autocomplete="off" placeholder="Buscar cliente...">
						<datalist id="customerOption"></datalist>
					</div>

					<div class="col-md-6">
						<label for="searchCellphone" class="form-label">Celular</label>
						<input type="search" class="form-control" id="searchCellphone" list="cellphoneOption"
							autocomplete="off" placeholder="Buscar celular...">
						<datalist id="cellphoneOption"></datalist>
					</div>

					<div class="col-12 text-end mt-4">
						<button class="btn btn-primary" title="Generar Reporte" type="button"
							onclick="generarReporte()">
							<i class="bi bi-file-earmark-spreadsheet-fill me-1"></i> Generar Reporte
						</button>
					</div>
				</form>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/credito/reportes.js}"></script>
		<!-- Eliminados scripts duplicados -->
	</th:block>
</body>

</html>
