<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Documentos Enviados</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Video Grabación</li>
					<li class="breadcrumb-item active">Consulta</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Búsqueda de Información</h5>

				<form class="row g-3 mb-4">
					<div class="col-md-4">
						<label class="form-label">Buscar por</label>
						<select class="form-select" id="opciones">
							<option value="0">Seleccione...</option>
							<option th:each="opcion : ${opcionesBusqueda}" th:value="${opcion.i_opcion}"
								th:text="${opcion.v_valor}" id="opcion"></option>
						</select>
					</div>

					<!-- Búsqueda por Solicitud -->
					<div class="col-md-6" id="divSolicitud" style="display:none;">
						<label class="form-label">Solicitud de Crédito</label>
						<input type="text" class="form-control solo-numero" id="solicitudBusqueda"
							placeholder="Ingrese solicitud de crédito" maxlength="12">
					</div>

					<!-- Búsqueda por Fechas -->
					<div class="col-md-6" id="divFechas" style="display:none;">
						<div class="row g-2">
							<div class="col-6">
								<label class="form-label">Fecha Inicio</label>
								<input type="date" class="form-control" id="fechaInicio">
							</div>
							<div class="col-6">
								<label class="form-label">Fecha Fin</label>
								<input type="date" class="form-control" id="fechaFin">
							</div>
						</div>
					</div>

					<div class="col-md-2 d-flex align-items-end">
						<button class="btn btn-warning w-100" type="button" onclick="buscarDatos()" id="btnBuscar">
							<i class="bi bi-search me-1"></i> Buscar
						</button>
					</div>
				</form>

				<!-- Resultados -->
				<div id="divResultados" style="display:none;">
					<div class="table-responsive">
						<table id="resultados" class="table table-hover text-center">
							<thead class="table-light">
								<tr>
									<th style="display:none;">ID</th>
									<th>Sol. Crédito</th>
									<th>Estatus</th>
									<th>Producto</th>
									<th>Fecha Registro</th>
									<th>Fecha Autorización</th>
									<th>Fecha Cancelación</th>
									<th>Fecha Envío</th>
									<th>PDF</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>

			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/js/videoGrabacion/videoGrabacion.js}"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<!-- Eliminados scripts legacy -->
	</th:block>
</body>

</html>
