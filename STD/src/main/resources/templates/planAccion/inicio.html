<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container border p-2">
			<div class="bg-info text-white">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div>
							<h2 style="text-align:center">Plan de accion</h2>
						</div>
					</div>
				</div>
			</div>


			<div id="divAceptarAsignacion" class="container">
				<fieldset class="border p-2">
					<legend class="float-none w-auto p-2">Aceptar Asignacion</legend>
					<div class="row" style="margin-top : 15px ">
						<div class="col-md-2">
							<label class="col-form-label"> No. de Oficio</label>
							<select class="form-control" id="idOficios" onchange="verDetalle(this)" readonly>
								<option value="0">Seleccione</option>
								<option th:each="listaFolios : ${lista_folios}" th:value="${listaFolios.pkFolio}"
									th:text="${listaFolios.folio}"></option>
							</select>
							<!--<input class="form-control" type="text" id="idNoOficio" placeholder="No. de Oficio">-->
						</div>
						<div class="col-md-4">
							<label class="col-form-label"> Asunto:</label>
							<!--<input class="form-control" type="text" id="idAsunto" placeholder="Asunto">-->
							<textarea type="text-Area" class="form-control" id="idAsunto"
								placeholder="Asunto" maxlength="600" readonly></textarea>
						</div>
						<div class="col-md-3">
							<label class="col-form-label"> Fecha de Recibo:</label>
							<input class="form-control" type="date" id="dtRecibo" placeholder="Fecha de Recibo" readonly>
						</div>
						<div class="col-md-3">
							<label class="col-form-label"> Fecha de Vencimiento:</label>
							<input class="form-control" type="date" id="dtVencimiento"
								placeholder="Fecha de Vencimiento" readonly>
						</div>
					</div>
					<div class="row" style="margin-top : 15px ">
						<table class="table table-bordered table-striped" style="width: 100%;" id="tblObservaciones">

							<thead>
								<tr>
									<th style="visibility:collapse; display:none;"></th>
									<th>Area de Atencion</th>
									<th>Responsable</th>
									<th>F. Asignación</th>
									<th>F. Vencimiento</th>
									<th>Observaciones a Atender</th>
									<th>Estatus</th>
									<th>¿Acepta la Observación?</th>
								</tr>
							</thead>

							<tbody>
							</tbody>

						</table>
					</div>
				</fieldset>
			</div>


			<div id="divRegistroPlanAccion" class="container" style="margin-top : 15px ">
				<fieldset class="border p-2">
					<legend class="float-none w-auto p-2">Registro de plan de accion de la Observacion:</legend>
					<div class="row" style="margin-top : 15px ">
						<input id="idAct" name="idAct" type="hidden" value="0">
						<div class="col-md-6">
							<label class="col-form-label"> Nombre de la Actividad</label>
							<!--<input class="form-control" type="text" id="idNombreActividad" placeholder="Asunto">-->
							<textarea type="text-Area" class="form-control" id="idNombreActividad"
								placeholder="Actividad" maxlength="600"></textarea>
						</div>
						<div class="col-md-6">
							<label class="col-form-label"> Encargado de la Actividad</label>
							<select class="form-control" id="idEncargadoActividad">
								<option value="0">Seleccione</option>
								<option th:each="listaEncargados : ${lista_encargados}" th:value="${listaEncargados.empleadoID}"
									th:text="${listaEncargados.nombreCompleto}"></option>
							</select>
						</div>
					</div>
					<div class="row" style="margin-top : 15px ">
						<div class="col-md-4">
							<label class="col-form-label"> Fecha de Inicio</label>
							<input class="form-control" type="date" id="dtFechaInicio" placeholder="No. de Oficio">
						</div>
						<div class="col-md-4">
							<label class="col-form-label"> Fecha Vencimiento</label>
							<input class="form-control" type="date" id="dtFechaVencimiento" placeholder="Asunto">
						</div>
						<div class="col-md-4">
							<label class="col-form-label"> Estatus</label>
							<select class="form-control" id="idEstatus">
								<option value="0">Seleccione</option>
								<option th:each="opcion : ${cat_lista_estatus}" th:value="${opcion.i_opcion}"
									th:text="${opcion.v_valor}"></option>
							</select>
						</div>
					</div>
					<div class="row" style="margin-top : 15px ">
						<div class="col-md-10"></div>
						<div class="col-md-2">
							<button type="button" class="btn btn-primary form-control" id="btnAgregar">Agregar</button>
						</div>
					</div>
					<div class="row" style="margin-top : 15px ">
						<table class="table table-bordered table-striped" style="width: 100%;" id="tblPlanAccion">

							<thead>
								<tr>
									<th style="visibility:collapse; display:none;">ID</th>
									<th>Actividad</th>
									<th>Encargado</th>
									<th>F. Inicio</th>
									<th>F. Vencimiento</th>
									<th>Estatus</th>
									<th>Confirmar Actividad</th>
									<th>Acciones</th>
								</tr>
							</thead>

							<tbody>

							</tbody>

						</table>
					</div>
				</fieldset>
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://code.jquery.com/jquery-3.2.1.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.26.10/dist/sweetalert2.all.min.js"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/planAccion/planAccion.js}"></script>
	</th:block>
</body>

</html>
