<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">
			<div class="row">
				<!-- Columna principal -->
				<div class="col-md-12">
					<!-- Card principal -->
					<div class="card card-primary">
						<div class="card-header">
							<h2 style="color: black; text-align: center;">Filtrado QEQ</h2>
						</div>
						<div class="card-body" style="padding-top: 20px;">

							<div class="row" style="padding-top: 20px;">
								<div class="col-sm-2">
									<select id="miListas">
										<option value="" disabled selected>Listas</option>
									</select>
								</div>
								<div class="col-sm-2" id="verEstatus">
									<select id="miEstatus"></select>
								</div>
								<div class="col-sm-8" id="verAgregar" style="text-align: right;">
									<button type="button" class="btn btn-success"
										onclick="agregarExclusion()">Agregar</button>
								</div>
							</div>

							<div class="row" style="padding-top: 20px;">
								<div class="col-sm-4" id="alertLista">
									<div class="alert alert-info alert-dismissible">
										<a data-dismiss="alert"></a>
										<strong id="etiquetaLista"></strong>
									</div>
								</div>
								<div class="col-sm-4" id="alertEstatus">
									<div class="alert alert-info alert-dismissible">
										<a data-dismiss="alert"></a>
										<strong id="etiquetaEstatus"></strong>
									</div>
								</div>
							</div>

							<div class="row" style="padding-top: 20px;">
								<div class="col-sm-12">
									<table class="table table-striped" id="tablaExclusion">
										<thead>
											<tr>
												<th>Listas</th>
												<th>Estatus</th>
												<th>Acción</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>

							<div class="row" style="padding-top: 30px;">
								<div class="col-sm-12">
									<label for="ejemplo_archivo_1">Adjuntar un archivo</label>
									<input type="file" id="ejemplo_archivo_1">
								</div>
							</div>

							<div class="row" style="padding-top: 20px;">
								<div class="col-sm-12">
									<table class="table table-striped" id="tablaBitacora">
										<thead>
											<tr>
												<th>Archivo</th>
												<th>Fecha</th>
												<th>No. registro</th>
												<th>No. registros excluidos</th>
												<th>No. registros finales</th>
												<th>Duración</th>
												<th>Estatus</th>
												<th>Comentarios</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://code.jquery.com/jquery-3.2.1.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/prevencion/pld.js}"></script>
		<script th:src="@{/css/estilos/responsivo.css}"></script>
		<!-- Latest compiled and minified CSS -->
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

		<!-- jQuery library -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

		<!-- Latest compiled JavaScript -->
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	</th:block>
</body>

</html>
