<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">
 
<head th:replace="layouts/base-layout :: head">
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
    <link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>
 
<body>
    <section class="content" layout:fragment="page-content">
 
        <div class="container" id="verInfo" style="display: none;">
            <div class="row">
                <!-- Columna principal -->
                <div class="col-md-12">
                    <!-- Card principal -->
                    <div class="card card-primary">
                        <div class="card-header">
                            <h2 style="color: black; text-align: center;">Filtrado de Listas Negras de QEQ</h2>
                        </div>
                        <div class="card-body" style="padding-top: 20px;">
 
                            <div id="relacionliEs">
                                <div class="row" style="padding-top: 20px;">
                                    <div class="col-sm-12">
                                        <li><label>Relación de Listas y Estatus</label></li>
                                    </div>
                                </div>
 
                                <div class="row" style="padding-top: 10px;">
                                    <div class="col-sm-2" style="padding: 10px;">
                                        <select id="miListas">
                                            <option value="" disabled selected>Listas</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-2" style="padding: 10px;" id="verEstatus">
                                        <select id="miEstatus"></select>
                                    </div>
                                    <div class="col-sm-2" id="verAgregar" style="text-align: right;">
                                        <button type="button" class="btn btn-success"
                                            onclick="agregarExclusion()">Agregar</button>
                                    </div>
                                </div>
 
                                <div class="row" style="padding-top: 20px;">
                                    <div class="col-sm-4" id="alertLista">
                                        <div class="alert alert-info alert-dismissible">
                                            <a data-dismiss="alert"></a>
                                            <strong id="etiquetaLista"></strong>
                                        </div>
                                    </div>
                                    <div class="col-sm-4" id="alertEstatus">
                                        <div class="alert alert-info alert-dismissible">
                                            <a data-dismiss="alert"></a>
                                            <strong id="etiquetaEstatus"></strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
 
                            <div class="row" style="padding-top: 30px;">
                                <div class="col-sm-12">
                                    <li><label>Tabla de Exclusiones</label></li>
                                </div>
                            </div>
 
                            <div class="row" style="padding-top: 10px;">
                                <div class="col-sm-12">
                                    <table class="table table-striped" id="tablaExclusion">
                                        <thead>
                                            <tr>
                                                <th style="text-align: center;">Listas</th>
                                                <th style="text-align: center;">Estatus</th>
                                                <th style="text-align: center;" id="thAccion">Acción</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                    <div style="text-align: right;" id="pagination-exclusion"></div>
                                </div>
                            </div>
 
                            <div id="cargaArchivo">
                                <div class="row" style="padding-top: 50px;">
                                    <div class="col-sm-12">
                                        <li><label>Cargar archivo</label></li>
                                    </div>
                                </div>
 
                                <div class="row" style="padding-top: 10px;">
                                    <div class="col-sm-4" style="padding: 5px;">
                                        <input type="file" id="inputArchivo" accept=".txt">
                                    </div>
                                    <div class="col-sm-6" id="botonGenerar">
                                        <button class="btn btn-primary" onclick="convertirArchivo()">Generar
                                            archivo</button>
                                    </div>
                                </div>
                            </div>
 
                            <div class="row" style="padding-top: 30px;">
                                <div class="col-sm-12">
                                    <li><label>Tabla de Bitacora</label></li>
                                </div>
                            </div>
 
                            <div class="row" style="padding-top: 10px;">
                                <div class="col-sm-12">
                                    <table class="table table-striped" id="tablaBitacora">
                                        <thead>
                                            <tr>
                                                <th>Archivo</th>
                                                <th>Fecha</th>
                                                <th>No. registro</th>
                                                <th>No. registros excluidos</th>
                                                <th>No. registros finales</th>
                                                <th>Duración</th>
                                                <th>Estatus</th>
                                                <th>Comentarios</th>
                                                <th>Usuario</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                    <div style="text-align: right;" id="pagination-bitacora"></div>
                                </div>
                            </div>
 
                        </div>
                    </div>
                </div>
            </div>
        </div>
 
        <div class="container" id="spinnerId">
            <div class="row">
                <!-- Columna principal -->
                <div class="col-md-12">
                    <!-- Card principal -->
                    <div class="card card-primary">
                        <div class="card-header">
                            <h2 style="color: black; text-align: center;">Filtrado de Listas Negras de QEQ</h2>
                        </div>
                        <div class="card-body" style="padding-top: 20px; text-align: center;">
 
                            <div class="row" style="margin: 20%;">
                                <div class="col-sm-12">
                                    <div class="spinner-border"
                                        style="color: cornflowerblue; width: 200px; height: 200px;"></div>
                                </div>
                            </div>
 
                        </div>
                    </div>
                </div>
            </div>
        </div>
 
    </section>
	<link th:href="@{/vendor/datatablesNew/dataTables.bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/estilos/responsivo.css}" rel="stylesheet">

	<th:block layout:fragment="page-scripts">

	    <script th:src="@{/js/jquery-3.5.1.js}"></script>

	    <script th:src="@{/vendor/datatablesNew/jquery.dataTables.min.js}"></script>
	    <script th:src="@{/vendor/datatablesNew/dataTables.bootstrap.min.js}"></script>

	    <script th:src="@{/vendor/sweetalertNew/sweetalert2.all.min.js}"></script>

	    <script th:src="@{/vendor/xlsxNew/xlsx.full.min.js}"></script>

	    <script th:src="@{/vendor/axiosNew/axios.min.js}"></script>

	    <script th:src="@{/js/prevencion/pld.js}"></script>

	</th:block>
</body>
</html>
