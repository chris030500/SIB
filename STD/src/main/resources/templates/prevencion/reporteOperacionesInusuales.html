<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head>
	<!-- Scripts específicos si son necesarios -->
</head>

<body>
	<section class="section" layout:fragment="page-content">

		<!-- Page Title -->
		<div class="pagetitle">
			<h1>Reporte de Operaciones Inusuales</h1>
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/inicio}">Inicio</a></li>
					<li class="breadcrumb-item">Prevención</li>
					<li class="breadcrumb-item active">Operaciones Inusuales</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<div class="card">
			<div class="card-body">
				<h5 class="card-title">Generar Reporte</h5>

				<form id="formReporte" class="row g-3">

					<div class="col-md-4">
						<label for="selectTipoProducto" class="form-label">Tipo Producto</label>
						<select class="form-select" id="selectTipoProducto">
							<option value="0">Seleccione</option>
							<option th:each="listaTipoProducto : ${cat_tipo_producto}"
								th:value="${listaTipoProducto.i_opcion}" th:text="${listaTipoProducto.v_valor}">
							</option>
						</select>
					</div>

					<div class="col-md-8" id="divProductosColocacion" style="display: none;">
						<label for="selectColocacion" class="form-label">Colocación</label>
						<select class="form-select" id="selectColocacion" multiple>
							<option value="0">Seleccione</option>
							<option th:each="listaProductosColocacion : ${cat_productos_colocacion}"
								th:value="${listaProductosColocacion.pkIProducCreditoId}"
								th:text="${listaProductosColocacion.vcDescripcion}">
							</option>
						</select>
					</div>

					<div class="col-md-8" id="divProductosCaptacion" style="display: none;">
						<label for="selectCaptacion" class="form-label">Captación</label>
						<select class="form-select" id="selectCaptacion" multiple>
							<option value="0">Seleccione</option>
							<option th:each="listaProductosCaptacion : ${cat_productos_captacion}"
								th:value="${listaProductosCaptacion.pkITipoCuentaId}"
								th:text="${listaProductosCaptacion.vcDescripcion}">
							</option>
						</select>
					</div>

					<div class="col-md-4">
						<label for="selectBusquedaCliente" class="form-label">Tipo Búsqueda Cliente</label>
						<select class="form-select" id="selectBusquedaCliente">
							<option value="0">Seleccione</option>
							<option th:each="listaBusquedaCliente : ${cat_busqueda_cliente}"
								th:value="${listaBusquedaCliente.i_opcion}" th:text="${listaBusquedaCliente.v_valor}">
							</option>
						</select>
					</div>

					<div class="col-md-8" id="divCustomerSearch" style="display: none;">
						<label for="searchCustomer" class="form-label">Cliente</label>
						<input type="search" class="form-control" id="searchCustomer" list="customerOption"
							autocomplete="off" placeholder="Buscar cliente...">
						<datalist id="customerOption"></datalist>
					</div>

					<div class="col-md-6">
						<label for="startDate" class="form-label">Fecha de inicio</label>
						<input class="form-control" type="date" id="startDate" required>
					</div>

					<div class="col-md-6">
						<label for="endDate" class="form-label">Fecha de fin</label>
						<input class="form-control" type="date" id="endDate" required>
					</div>

					<div class="col-12 text-end mt-4">
						<button class="btn btn-primary" title="Generar Reporte" type="button"
							onclick="generarReporte()">
							<i class="bi bi-file-earmark-spreadsheet-fill me-1"></i> Generar Reporte
						</button>
					</div>
				</form>
			</div>
		</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<!-- Scripts -->
		<script th:src="@{/vendor/blockUI/jquery.blockUI.js}"></script>
		<script th:src="@{/js/prevencion/reporteOperacionesInusuales.js}"></script>
		<!-- Eliminados scripts duplicados -->
	</th:block>
</body>

</html>
