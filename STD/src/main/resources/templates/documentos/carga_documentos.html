<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Carga de documentos</title>

	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
	<link href="@{/vendor/bootstrap/css/datepicker.css}" rel="stylesheet">
	<!--<link href="@{/vendor/css/bootstrap-datetimepicker.css}" rel="stylesheet">-->
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Carga de Documentos</h2>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h5 class="card-title"></h5>


							<div class="row">
								<form class="row g-3" id="formSolicitudCredito">
									<div class="col-md-3">
										<label for="inputEmail5" class="form-label">Solicitud de crédito</label>
										<code>(*)</code>
									</div>
									<div class="col-md-5">
										<input type="text" placeholder="Ingresa la solicitud de crédito"
											class="form-control" id="solicitudCredito">
									</div>
									<div class="col-sm-6">
										<label for="usu" class="form-label">¿Es nuevo cliente?</label> <code>(*)</code>
										<div>
											<input type="checkbox" id="usuarioNuevo" name="usuarioPregunta" value="1"
												onclick="desmarcar()">
											  <label for="usuarioNuevo">Si</label><br>
										</div>
										<div>
											<input type="checkbox" id="noUsuarioNuevo" name="usuarioPregunta" value="2"
												onclick="desmarcar()">
											  <label for="noUsuarioNuevo">No</label><br>
										</div>
									</div>
									<div class="col-md-4">
										<button type="button" onclick="buscarSolicitudCredito(solicitudCredito.value)"
											class="btn btn-primary">Buscar</button>
									</div>
								</form>
								<div class="col-lg-12" id='datoSolicitud' style='display:none'>
									<div class="row">
										<div class="col-sm-3">
											<label for="solicitud" class="form-label">Solicitud</label>
											<input type="text" class="form-control" id="solicitud" readonly>
										</div>
										<div id="divIdProducto" class="col-sm-3" >
											<label for="producto" class="form-label">IDProducto</label>
											<input type="text" class="form-control" id="producto" readonly>
										</div>
										
										<div class="col-sm-3">
											<label for="producto" class="form-label">Producto</label>
											<input type="text" class="form-control" id="Nombreproducto" readonly>
										</div> 
										<div class="col-sm-3">
											<label for="montoSolicitado" class="form-label">Monto Solicitado</label>
											<input type="number" class="form-control" id="montoSolicitado" readonly>
										</div>
										<div class="col-sm-3">
											<label for="montoAutorizado" class="form-label">Monto Autorizado</label>
											<input type="number" class="form-control" id="montoAutorizado" readonly>
										</div>
										<div class="col-sm-4">
											<label for="plazo" class="form-label">Plazo</label>
											<input type="text" class="form-control" id="plazo" readonly>
										</div>
										<div class="col-sm-4">
											<label for="tasaNormal" class="form-label">Tasa Normal</label>
											<input type="number" class="form-control" id="tasaNormal" readonly>
										</div>

										<div class="col-sm-4">
											<label for="estatus" class="form-label">Estatus</label>
											<input type="text" class="form-control" id="estatus" readonly>
										</div>
									</div>
								</div>

							</div>

							<div id="divParticipantes" class="container" style='display:none'>
								<div class="row" style="margin-top : 15px ">
									<fieldset class="border p-2">
										<legend class="w-auto">Participantes</legend>
										<table id="participantes" class="table">
											<thead>
												<tr>
													<th scope="col">Nombre</th>
													<th scope="col">Rol</th>
													<th scope="col">Tel. Celular</th>
													<th scope="col">Correo</th>
												</tr>
											</thead>
											<tbody>

											</tbody>
										</table>
									</fieldset>
								</div>

							</div>

							<div id="divDocumentos" class="container" style='display:none'>
								<div class="row" style="margin-top : 15px">
									<fieldset class="border p-2">
										<legend class="w-auto">Archivos</legend>
										<table class="table table-bordered table-striped" id="tablaDocumentos">
											<thead>
												<tr>
													<th>Nombre de documento</th>
													<th>Ubicación</th>
													<th></th>
												</tr>
											</thead>
											<tbody>
												<!--<tr>
													<td><input type="text" name="nombre1" id="nombre1" value="nombre1"
															readonly></td>
													<td><input class="form-control" type="file" id="formFile1"
															value="formFile1" accept=".pdf"></td>
													<td>
														<button type="button" class="btn btn-danger"
															onclick="eliminarFila()">Eliminar</button>
													</td>
													<td>Nombre</td>
												<td><input class="form-control" type="file" id="formFile" accept=".pdf" required></td>
												</tr>-->
											</tbody>
										</table>
									</fieldset>

								</div>
							</div>

							<div class="container" id="divFechas" style='display:none'>
								<div class="row">
									<form class="row g-3">
										<div class="row">
											<div class="col-sm-6">
												<label for="fEnvio" class="form-label">Fecha de Envío </label>
												<input name="fEnvio" type="date" class="form-control" id="fEnvio"
													onfocusout="activarFechaHoraCancelación()">
											</div>
											<div class="col-sm-6">
												<label for="hCancelacion" class="form-label">Hora de
													Envío</label>
												<input type="time" value="09:00" class="form-control" id="hEnvio" 
													readonly>
											</div>
											<div class="col-sm-6">
												<label for="fCancelacion" class="form-label">Fecha de
													Cancelación</label>
												<input type="date" class="form-control" id="fCancelacion" readonly>
											</div>
											<div class="col-sm-6">
												<label for="hCancelacion" class="form-label">Hora de
													Cancelación</label>
												<input type="time" value="15:00" class="form-control" id="hCancelacion" readonly>
											</div>
											<div class="col-sm-12">
												<label for="comentarioValidacion" class="form-label">Comentarios de
													Validación</label>
												<input type="text" class="form-control" id="comentarioValidacion">
											</div>
										</div>
										<div class="col-sm-2">
											<button type="button" class="btn btn-primary">
												Guardar
											</button>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>


			</div>
		</div>
	</section>
	<th:block layout:fragment="page-scripts">
		<!--JavaScript-->
		<script th:src="@{/js/cargaDocumentos/carga_documentos.js}"></script>
	</th:block>
</body>

</html>
