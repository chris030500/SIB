<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Documentos</h2>
						</div>
					</div>
				</div>
			</div>

			<ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">Inicio</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Alta Documento</button>
    </li>
   
  </ul>
  <div class="tab-content" id="pills-tabContent">
    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
   
   <form class="row g-3">
							
									<div class="col-md-5">
										<input type="text" placeholder="Ingresa el documento a buscar"
											class="form-control" id="solicitudCredito">
									</div>
									<div class="col-md-4">
										<button type="submit" class="btn btn-primary">Buscar</button>
									</div>
								</form>
   
   <table class="table table-bordered table-striped">

						<thead>
							<tr>
								<th>Nombre Documento</th>
								<th>Descripcion</th>
								<th>Estatus</th>
								<th class="text-center">Opciones</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="perfil: ${perfiles}">

								<td th:text="${perfil.vc_nombre_perfil}">
								<td th:text="${perfil.vc_descripcion_perfil}">
								<td th:text="${perfil.vc_estatus}">

								<td class="text-center">

								

									<!-- Botón para eliminar registro del perfil -->
									<button class="btn btn-danger btn-sm" id="idperfil" name="idperfil"
										onclick="estatusPerfil(this.value)" href="#" title="Eliminar perfil"
										data-toggle="modal" data-target="#" th:value="${perfil.pk_id_perfil}">
										<i class="fas fa-trash"></i>
									</button>

								</td>

							</tr>

							<tr th:if="${#lists.isEmpty(perfiles)}">
								<td colspan="6">
									A&uacute;n no se registran documentos en el sistema
								</td>
							</tr>

						</tbody>



					</table>
    </div>
    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
    		<div class="container">
								<div class="row">
									<table border="1" class="table" id="tablaDocumentos">
										<thead class="thead-dark">
											<tr>
												<th>Nombre de documento</th>
												<th>Ubicación</th>
											</tr>
										</thead>
										<tbody>
											<tr>
												<td><input type="text" name="nombre1" id="nombre1" value="nombre1" readonly></td>
												<td><input class="form-control" type="file" id="formFile1"
														value="formFile1" accept=".pdf"></td>
												<!--<td>Nombre</td>
												<td><input class="form-control" type="file" id="formFile" accept=".pdf" required></td>-->
											</tr>
										</tbody>
									</table>

									<div class="form-group">
										<button type="button" class="btn btn-primary mr-2"
											onclick="agregarFila()">Agregar otro documento</button>
										<button type="button" class="btn btn-danger" onclick="eliminarFila()">Eliminar
											último documento</button>
									</div>
								</div>
							</div>
    </div>
    <div class="tab-pane fade" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab">...</div>
  </div>
			
		
	</section>
	<th:block layout:fragment="page-scripts">
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/cargaDocumentos/carga_documentos.js}"></script>
	
		<!--JavaScript-->
	</th:block>
	</body>
</html>
