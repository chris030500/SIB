<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base-layout}">

<head th:replace="layouts/base-layout :: head">
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css" rel="stylesheet">
	<link th:href="@{/vendor/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
	<section class="content" layout:fragment="page-content">
		<div class="container">

			<div class="card mb-3">
				<div class="row no-gutters">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<div class="card-body">
							<h2 style="text-align:center">Documentos</h2>
						</div>
					</div>
				</div>
			</div>

			<ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
				<li class="nav-item" role="presentation">
					<button id="btnAltaProductos" class="nav-link active" data-bs-toggle="pill"
						data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home"
						aria-selected="true">Alta Documento</button>
				</li>
			</ul>

			<div class="tab-content" id="pills-tabContent">
				<div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
					<table class="table table-bordered table-striped">
						<thead>
							<tr>
								<th>Nombre Documento</th>
								<th>Estatus</th>
								<th class="text-center">Opciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="documento: ${documento}">
								<td th:text="${documento.vc_nombre_doc}"></td>
								<td th:text="${documento.i_estatus}==1?'ACTIVO':'INACTIVO'"></td>
								<td class="text-center">
									<!-- Botón para eliminar registro del perfil -->
									<button class="btn btn-primary btn-sm" id="btnEliminar" 
										onclick="eliminarDocumento(this.value)" title="Eliminar documento"
										data-toggle="" data-target="#" th:value="${documento.pk_id_documento}">
										<i class="fas fa-trash"></i>
									</button>

									<!-- Botón para eliminar registro del perfil -->
									<button class="btn btn-primary btn-sm" id="btnReactivar" 
										onclick="reactivarDocumento(this.value)" title="Reactivar documento"
										data-toggle="" data-target="#" th:value="${documento.pk_id_documento}">
										<i class="fas fa-check-circle"></i>
									</button>
									
										<!-- Botón para editar registro del perfil -->
									<button class="btn btn-primary btn-sm" id="btnEditar" 
										onclick="editarDocumento(this)"  title="Editar documento"
										data-toggle="" data-target="#" th:value="${documento.pk_id_documento}">
										<i class="fas fa-edit"></i>
									</button>
									
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(documento)}">
								<td colspan="6">
									A&uacute;n no se registran documentos en el sistema
								</td>
							</tr>

						</tbody>
					</table>
    	</div>
 	 </div>
	
	
	<div class="modal" id="modalDocumentos">
				<div class="modal-dialog">
					<div class="modal-content">


						<div class="modal-header">
							<h2 class="modal-title" id="lblTitulo"></h2>
						</div>
						<div class="modal-body">
							<form>
							<div class="col-sm-8" style="margin-top: 10px">
								<label for="busqueda" class="col-form-label">Nombre Documento:</label>
							</div>
							<div  class="col-sm-10" style="margin-top: 10px">
								<input type="text" class="form-control col-sm-8" id="inputDocumento" placeholder="Nombre Documento" maxlength="300">
							</div>
							</form>
						</div>
						<!-- Modal footer -->
						<div class="modal-footer">
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnRegistrar">Registrar</button>
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnCancelar">Cancelar</button>
						</div>
					</div>
				</div>
	</div>
	<div class="modal" id="editDocumentos">
				<div class="modal-dialog">
					<div class="modal-content">


						<div class="modal-header">
							<h2 class="modal-title" id="lblTitulo"></h2>
						</div>
						<div class="modal-body">
							<form>
							<div class="col-sm-8" style="margin-top: 10px">
								<label for="busqueda" class="col-form-label">Nombre Documento:</label>
							</div>
							<div  class="col-sm-10" style="margin-top: 10px">
								<input type="text" class="form-control col-sm-8" id="editDocumento" placeholder="Nombre Documento" maxlength="300">
							</div>
							</form>
						</div>
						<!-- Modal footer -->
						<div class="modal-footer">
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnEnviar">Actualizar</button>
							<button type="button" class="btn btn-primary" data-dismiss="modal" id="btnCancelarEnvio">Cancelar</button>
						</div>
					</div>
				</div>
	</div>

	</section>
	<th:block layout:fragment="page-scripts">
		<script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
		<script th:src="@{/js/altaDocumentos/registro_documentos.js}"></script>
	
		<!--JavaScript-->
	</th:block>
	</body>
</html>
